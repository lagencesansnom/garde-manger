<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factures → stock Toporder — Le Garde-Manger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F5F1; --white: #FFFFFF; --border: #E7E3DB; --text: #1A1A1A; --muted: #7C7469; --subtle: #F1ECE4;
      --accent: #3D6B35; --accent-dark: #2E5228; --accent-soft: #E8F0E4;
      --ok: #3A7D44; --ok-soft: #E7F1E7; --warn: #9A6B00; --warn-soft: #FBF0D9; --error: #B3311F; --error-soft: #FBE6E2;
      --info: #245C8F; --info-soft: #E6EEF6;
      --font-d: 'Bricolage Grotesque', sans-serif; --font-b: 'Inter', sans-serif;
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 24px 16px 96px; }
    .container { max-width: 1120px; margin: 0 auto; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    a { color: var(--accent); }

    /* Header */
    .app-header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .app-titles { flex: 1; min-width: 220px; }
    .app-titles h1 { font-family: var(--font-d); font-size: clamp(1.3rem, 3.4vw, 1.75rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
    .app-titles h1 span { color: var(--accent); }
    .app-titles p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .cat-chip { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Panels */
    .panel { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; }
    .panel-head { display: flex; align-items: center; gap: 9px; font-family: var(--font-d); font-size: 16px; font-weight: 700; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-head .spacer { flex: 1; }
    .step-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; font-family: var(--font-b); }
    .label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }

    /* Controls */
    button { font-family: var(--font-b); cursor: pointer; }
    .btn { font-size: 13px; font-weight: 600; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--white); color: var(--text); padding: 8px 14px; transition: background .15s, border-color .15s; white-space: nowrap; }
    .btn:hover { border-color: #CFC8BB; background: var(--subtle); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn-lg { font-size: 15px; padding: 12px 22px; }
    .btn-danger { background: var(--error); border-color: var(--error); color: #fff; }
    .btn-danger:hover { background: #8F2718; border-color: #8F2718; }

    /* Fenêtres de confirmation / d'erreur (à la place des popups du navigateur) */
    .dlg-bg { z-index: 70; align-items: center; }
    .dlg { max-width: 480px; box-shadow: 0 18px 48px rgba(0,0,0,.18); }
    .dlg-head { display: flex; gap: 12px; align-items: flex-start; }
    .dlg-head h3 { margin: 2px 0 0; line-height: 1.3; }
    .dlg-ic { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; background: var(--info-soft); color: var(--info); }
    .dlg.warn .dlg-ic { background: var(--warn-soft); color: var(--warn); }
    .dlg.error .dlg-ic, .dlg.danger .dlg-ic { background: var(--error-soft); color: var(--error); }
    .dlg-body { margin: 12px 0 0 42px; font-size: 13.5px; color: #3A3632; display: flex; flex-direction: column; gap: 8px; }
    .dlg-body ul { margin-left: 18px; }
    .dlg-body li { margin: 2px 0; }
    .busy-bg { z-index: 80; align-items: center; }
    .busy { max-width: 400px; text-align: center; padding: 28px 24px; box-shadow: 0 18px 48px rgba(0,0,0,.18); }
    .busy .spinner { width: 34px; height: 34px; border-width: 3px; margin-bottom: 14px; }
    .busy p { font-size: 13px; color: var(--muted, #6B6560); margin-top: 6px; }
    .btn-sm { font-size: 12px; padding: 5px 10px; }
    .btn-link { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 0; text-decoration: underline; }
    input[type=text], input[type=number], input[type=date], input[type=search], select {
      font-family: var(--font-b); font-size: 13px; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 9px; background: var(--white); color: var(--text); min-width: 0;
    }
    input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .field { display: flex; flex-direction: column; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }

    /* Drop zone */
    .drop { border: 2px dashed #CFC8BB; border-radius: var(--r-md); padding: 28px 16px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; flex: 1; min-width: 240px; }
    .drop:hover, .drop.over { background: var(--accent-soft); border-color: var(--accent); }
    .drop strong { font-size: 15px; display: block; margin-bottom: 4px; }

    /* Queue */
    .queue { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .q-item { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 100px; padding: 5px 12px; font-size: 12.5px; background: var(--white); cursor: pointer; max-width: 100%; }
    .q-item.active { border-color: var(--accent); background: var(--accent-soft); }
    .q-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #CFC8BB; flex-shrink: 0; }
    .dot.lecture { background: var(--info); animation: pulse 1s infinite; }
    .dot.pret { background: var(--warn); }
    .dot.genere { background: var(--ok); }
    .dot.erreur { background: var(--error); }
    @keyframes pulse { 50% { opacity: .3; } }

    /* Banners */
    .banner { border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .banner b { font-weight: 700; }
    .banner.error { background: var(--error-soft); color: #7A1F12; }
    .banner.warn { background: var(--warn-soft); color: #6B4A00; }
    .banner.ok { background: var(--ok-soft); color: #25502C; }
    .banner.info { background: var(--info-soft); color: #173E61; }
    .banner .grow { flex: 1; min-width: 200px; }

    /* Invoice header */
    .inv-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat { background: var(--subtle); border-radius: var(--r-md); padding: 8px 14px; font-size: 13px; }
    .stat b { font-size: 18px; font-family: var(--font-d); margin-right: 4px; }
    button.stat { border: 2px solid transparent; cursor: pointer; font: inherit; color: inherit; }
    button.stat:hover:not(:disabled) { border-color: var(--border); }
    button.stat.active { background: var(--white); border-color: var(--muted); }
    button.stat.ok.active { border-color: var(--ok); } button.stat.warn.active { border-color: var(--warn); }
    button.stat:disabled { cursor: default; opacity: .6; }
    .stat.ok b { color: var(--ok); } .stat.warn b { color: var(--warn); } .stat.muted b { color: var(--muted); }

    /* Table */
    .group-title { font-family: var(--font-d); font-weight: 700; font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; background: var(--subtle); border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    td.num input { width: 84px; text-align: right; }
    td input[type=date] { width: 138px; }
    .lib { font-weight: 600; }
    .sub { font-size: 11.5px; color: var(--muted); }
    .prod { font-weight: 500; }
    .prod.none { color: var(--muted); font-style: italic; font-weight: 400; }
    .badge { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 100px; margin: 0 4px 3px 0; white-space: nowrap; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.block { background: var(--error-soft); color: var(--error); }
    .badge.info { background: var(--warn-soft); color: var(--warn); }
    .badge.grey { background: var(--subtle); color: var(--muted); }
    .msg { font-size: 12px; margin-top: 3px; }
    .msg.block { color: var(--error); } .msg.info { color: var(--warn); }
    .actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .alloc { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .alloc label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .alloc input { width: 74px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .count { background: var(--warn-soft); color: var(--warn); border-radius: 100px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
    details summary { cursor: pointer; font-family: var(--font-d); font-weight: 700; font-size: 15px; margin: 18px 0 8px; }

    /* Footer bar */
    .gen-bar { position: sticky; bottom: 12px; background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 6px 24px rgba(0,0,0,.08); margin-top: 18px; }
    .gen-bar .grow { flex: 1; min-width: 200px; font-size: 13.5px; }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(26,26,26,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
    .modal { background: var(--white); border-radius: var(--r-lg); padding: 20px; width: 100%; max-width: 620px; }
    .modal h3 { font-family: var(--font-d); font-size: 17px; margin-bottom: 4px; }
    .results { max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r-md); margin-top: 10px; }
    .res { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .res:last-child { border-bottom: none; }
    .res:hover { background: var(--subtle); }
    .res.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
    .res.sel .prod::before { content: '✓ '; color: var(--accent); font-weight: 700; }
    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
    /* Tableau de bord */
    .dash-filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
    .seg button { border: none; background: var(--white); padding: 7px 11px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.on { background: var(--accent-soft); color: var(--accent-dark); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; background: var(--white); }
    .kpi .k-name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .kpi .k-val { font-family: var(--font-d); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .kpi .k-sub { font-size: 12.5px; color: var(--muted); }
    .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; display: inline-block; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart { position: relative; width: 100%; }
    .chart svg { display: block; }
    .chart text { font-family: var(--font-b); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .tip { position: absolute; pointer-events: none; background: var(--white); border: 1px solid var(--border); border-radius: var(--r-sm); box-shadow: 0 6px 18px rgba(0,0,0,.10); padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; }
    .tip .t-h { font-weight: 700; margin-bottom: 4px; }
    .tip .t-r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .tip .t-r > span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--subtle); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 100px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }
  </style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <div class="app-titles">
      <h1>Factures fournisseurs → <span>stock Toporder</span></h1>
      <p>Le Garde-Manger — déposez une facture, vérifiez les lignes, téléchargez le fichier à importer dans Toporder.</p>
    </div>
    <div class="cat-chip" id="catChip"><span class="spinner"></span> Chargement…</div>
  </header>

  <div id="app"><div class="loading"><span class="spinner"></span> Chargement du catalogue…</div></div>
</div>

<input type="file" id="matrixInput" accept=".xlsx" class="hidden">
<input type="file" id="fileInput" accept="application/pdf,image/jpeg,image/png,image/webp" multiple class="hidden">
<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<div id="busyRoot"></div>

<script>
// =================================================================
//  État
// =================================================================
const S = {
  init: null,          // données serveur (catalogue, correspondances, durées, paramètres…)
  lieu: '',            // lieu par défaut choisi
  queue: [],           // factures déposées
  current: -1,
  idx: null            // index de rapprochement
};
const ALERTS = {
  INCONNU:      { block: true,  label: 'Produit inconnu', msg: "Ce code-barres n'existe pas dans Toporder : créez le produit dans Toporder puis mettez à jour le catalogue, ou associez-le à un produit existant." },
  NOM_EAN_DIFF: { block: true,  label: 'Code-barres différent', msg: "Un produit au nom très proche existe avec un autre code-barres (le fournisseur l'a peut-être changé). Vérifiez, puis associez-le si c'est le même." },
  A_ASSOCIER:   { block: true,  label: 'À associer', msg: "Pas de code-barres : choisissez le produit Toporder correspondant. Le choix sera retenu pour les prochaines factures." },
  A_CREER:      { block: true,  label: 'À créer', msg: "Fiche produit prête. Générez le fichier de création (en haut de la facture), importez-le dans Toporder, puis mettez à jour le catalogue : la ligne sera reconnue." },
  UNITE:        { block: true,  label: 'Unité', msg: '' },
  AVOIR:        { block: true,  label: 'Avoir', msg: "Ligne d'avoir : aucun mouvement de stock (produit non vendable). Si c'est un produit manquant, corrigez le stock à la main dans Toporder." },
  CONFIANCE:    { block: true,  label: 'À relire', msg: '' },
  DLC:          { block: true,  label: 'DLC', msg: "Pas de DLC sur la facture : saisissez-la, enregistrez une durée de conservation, ou importez sans DLC." },
  REPARTITION:  { block: true,  label: 'Répartition', msg: '' },
  DEJA_BL:      { block: true,  label: 'BL déjà importé', msg: '' },
  PRIX:         { block: false, label: 'Prix', msg: '' },
  CONVERSION:   { block: false, label: 'Conversion', msg: '' },
  LIEU:         { block: false, label: 'Boutique lue', msg: '' },
  NOUVEAU:      { block: true,  label: 'Nouveau produit', msg: "Produit créé depuis l'appli, pas encore de Clé Toporder : importez la nouvelle matrice (Stock → Import de stock dans Toporder) pour que la ligne entre dans le fichier. S'il est dans Toporder sous un autre nom : « Changer »." }
};
const NON_LIVRE_RE = /rupture|non[\s-]*livr|manquant|reliquat|[ée]puis[ée]|disponibilit[ée]\s+pr[ée]vue|[àa]\s+livrer|non\s+disponible|indisponible/i;
const KIND_LABEL = { avoir: 'avoir', non_livre: 'non livré', frais: 'frais', autre: 'autre' };
const kindMotif = (L) => L.kind === 'non_livre' ? 'Non livré' + (L.src.remarque ? ' : ' + L.src.remarque : '') + ' — rien n\'entre en stock'
  : L.kind === 'avoir' ? ALERTS.AVOIR.msg : 'Frais / taxe : ignoré';

// =================================================================
//  Utilitaires
// =================================================================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (x, d = 2) => (x == null || isNaN(x)) ? '' : Number(x).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtE = (x) => (x == null || isNaN(x)) ? '—' : Number(x).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' €';
const isoToFr = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const validIso = (iso) => /^\d{4}-\d{2}-\d{2}$/.test(iso || '') && !isNaN(new Date(iso + 'T00:00:00'));
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + Number(n)); return d.toISOString().slice(0, 10); };
const round = (x, d) => { const p = Math.pow(10, d); return Math.round(x * p) / p; };
const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.').replace(/\s/g, '')); return isNaN(n) ? null : n; };

function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

// Fenêtre de confirmation / d'information de l'appli. Remplace confirm() / alert() du navigateur, qui affichent
// l'adresse technique Google (« Une page intégrée à l'adresse …googleusercontent.com indique »).
// body = HTML déjà échappé. Résout true (bouton principal, Entrée), 'alt' (bouton secondaire facultatif)
// ou false (Annuler, Échap, clic à côté).
function dialog({ title, body = '', ok = 'OK', cancel = '', alt = '', tone = 'info' }) {
  return new Promise(resolve => {
    let done = false;
    const close = (v) => { if (done) return; done = true; $('dialogRoot').innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(false); } else if (e.key === 'Enter') { e.preventDefault(); const f = document.activeElement && document.activeElement.id; close(f === 'dlgNo' ? false : f === 'dlgAlt' ? 'alt' : true); } };
    $('dialogRoot').innerHTML = `<div class="modal-bg dlg-bg" id="dlgBg"><div class="modal dlg ${tone}" role="${cancel ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgT">
      <div class="dlg-head"><span class="dlg-ic" aria-hidden="true">${tone === 'info' ? 'i' : '!'}</span><h3 id="dlgT">${esc(title)}</h3></div>
      ${body ? `<div class="dlg-body">${body}</div>` : ''}
      <div class="modal-foot">${cancel ? `<button class="btn" id="dlgNo">${esc(cancel)}</button>` : ''}
        ${alt ? `<button class="btn" id="dlgAlt">${esc(alt)}</button>` : ''}
        <button class="btn ${tone === 'danger' ? 'btn-danger' : 'btn-primary'}" id="dlgOk">${esc(ok)}</button></div></div></div>`;

// Servi par Apps Script : google.script.run. Servi par GitHub Pages (lien donné au client) : POST vers le
// déploiement fixe du client (doPost de Code.gs). Corps en text/plain pour éviter la pré-vérification CORS.
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxjdG2-BVfyRQFM_lnYBJ_NNdMzb9PDwf5ynmaEB0H3lOuYTG3wfRzz0W9IZ7EZ2uaG/exec';
async function call(fn, ...args) {

    let res;
    try {
      res = await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
    } catch (e) { throw new Error('Serveur injoignable : vérifiez la connexion internet et réessayez.'); }
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('Réponse inattendue du serveur (' + res.status + '). Réessayez dans un instant.'); }
    if (!out.ok) throw new Error(String(out.error || 'Erreur inconnue').replace(/^(Exception|Error):\s*/i, ''));
    return out.result;
  }
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(err => reject(new Error(String(err && err.message || err).replace(/^(Exception|Error):\s*/i, ''))))[fn](...args);

// Normalisations — mêmes règles que Code.gs
function normLabel(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
const LEGAL = ['sas', 'sasu', 'sarl', 'eurl', 'sa', 'sca', 'scea', 'earl', 'gaec', 'ste', 'societe', 'ets', 'etablissements'];
function normEmetteur(s) { return normLabel(s).split(' ').filter(w => LEGAL.indexOf(w) < 0).join(' ').toUpperCase(); }
function normEan(v) {
  if (v === '' || v == null) return '';
  let s = String(v).replace(/\D/g, '');
  if (s.length === 14 && s[0] === '0') s = s.slice(1);
  if (s.length < 8 || s.length > 13 || /^0+$/.test(s)) return '';
  // Moins de 8 chiffres significatifs : pas un vrai code-barres (ex. réf. 93901 imprimée « 0000000939015 »).
  if (s.replace(/^0+/, '').length < 8) return '';
  return s.padStart(13, '0');
}

// N° de BL : mêmes règles que normBl_ dans Code.gs
function normBl(s) { return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^(BONDELIVRAISON|LIVRAISON|BL)(NO?(?=\d))?/, '').replace(/^0+/, ''); }

// Similarité de noms (suggestions uniquement — jamais d'association automatique par le nom)
const STOP = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'l', 'd', 'au', 'aux', 'a', 'et', 'en', 'sous', 'vide', 'ss', 'par', 'x', 'avec', 'sans', 'bio']);
function tokens(s) { return normLabel(s).split(' ').filter(w => w.length > 1 && !STOP.has(w)).map(w => w.length > 4 ? w.replace(/s$/, '') : w); }
function trigrams(s) { const t = ' ' + normLabel(s) + ' '; const out = new Set(); for (let i = 0; i < t.length - 2; i++) out.add(t.slice(i, i + 3)); return out; }
function dice(a, b) { if (!a.size || !b.size) return 0; let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return 2 * n / (a.size + b.size); }
function similarity(q, p) { return 0.5 * dice(q.tok, p._tok) + 0.5 * dice(q.tri, p._tri); }
// w = poids d'une pièce lu sur le document : les produits du même format remontent, les autres formats descendent.
// s = score de classement, sim = similarité des noms seule.
function suggest(label, n = 3, w = null) {
  const q = { tok: new Set(tokens(label)), tri: trigrams(label) };
  return S.init.produits.map(p => {
    const sim = similarity(q, p);
    const pw = p._w !== undefined ? p._w : nameWeight(p.n);
    return { p, sim, s: sim + (w && pw ? (sameWeight(pw, w) ? 0.25 : -0.25) : 0) };
  }).sort((a, b) => b.s - a.s).slice(0, n);
}

// ── Format (poids) : distingue « pain bis 500 g » et « pain bis 1 kg » quand la désignation ne le dit pas ──
// Poids écrit dans un nom (« Pain bis 500g », « Saucisses 1,2 kg ») → kg.
function nameWeight(s) {
  const m = /(\d+(?:[.,]\d+)?)\s?(kg|kilos?|grs?|g)\b/i.exec(String(s || ''));
  if (!m) return null;
  const v = Number(m[1].replace(',', '.'));
  return v > 0 ? round(/^k/i.test(m[2]) ? v : v / 1000, 3) : null;
}
// Poids d'une pièce de la ligne : lu par l'IA, sinon poids total / nombre de pièces, sinon écrit dans la désignation.
function lineWeight(src) {
  const w = num(src.poids_unitaire_kg);
  if (w > 0) return round(w, 3);
  const pt = num(src.poids_total_kg), n = num(src.nombre_pieces) || (src.unite === 'U' ? num(src.quantite) : null);
  if (pt > 0 && n > 0) return round(pt / n, 3);
  return src.unite === 'COLIS' ? null : nameWeight(src.libelle);
}
const sameWeight = (a, b) => Math.abs(a - b) <= 0.02 * Math.max(a, b);
const fmtW = (kg) => kg >= 1 ? fmtN(kg, 3) + ' kg' : fmtN(kg * 1000, 0) + ' g';
// Conversion d'unité déduite du poids / du nombre de pièces lus sur le document (ex. 8 pains = 4 kg).
// Colis : produit Toporder vendu par lot (« … x1000 » pour un « colis de 1000 ») → 1 colis = 1 article ;
// sinon nombre d'unités du colis écrit sur la ligne (« colis de 6 », « carton de 12 ») → 1 colis = N articles.
function autoConv(src, w, prodU, prodName) {
  const q0 = Number(src.quantite), mt = num(src.montant_ht), pu0 = num(src.prix_unitaire_ht_net);
  const total = mt != null ? Math.abs(mt) : (pu0 != null && q0 > 0 ? pu0 * q0 : null);
  if (prodU === 'U' && src.unite === 'COLIS' && q0 > 0) {
    const lib = String(src.libelle || '');
    const lot = /\bx\s?(\d+)\b/i.exec(String(prodName || ''));
    const m = /\b(?:colis|carton|caisse|lot|pack|paquet|sachet|boite|boîte)s?\s+(?:de\s+)?(\d+)(?!\d)/i.exec(lib) || /\bx\s?(\d+)\s?(?:u|pc|pcs|pi[eè]ces?)?\b/i.exec(lib);
    const nCol = m ? Number(m[1]) : (num(src.nombre_pieces) > q0 ? num(src.nombre_pieces) / q0 : null);
    if (lot && new RegExp('(^|\\D)' + lot[1] + '(?!\\d)').test(lib)) return { qty: q0, pu: total != null ? total / q0 : null, note: `1 colis = 1 article (le produit Toporder est le lot « x${lot[1]} »)` };
    if (nCol > 1) return { qty: q0 * nCol, pu: total != null ? total / (q0 * nCol) : null, note: `${fmtN(q0, 3)} colis de ${fmtN(nCol, 0)} = ${fmtN(q0 * nCol, 0)} article(s)` };
  }
  if (prodU === 'KG' && src.unite !== 'KG') {
    const kg = num(src.poids_total_kg) || (w && src.unite === 'U' && q0 > 0 ? w * q0 : null);
    if (kg > 0) return { qty: kg, pu: total != null ? total / kg : null, note: `${fmtN(q0, 3)} ${unitLabel(src.unite)} = ${fmtN(kg, 3)} kg (poids lu sur le document)` };
  }
  if (prodU === 'U' && src.unite === 'KG' && q0 > 0) {
    let n = num(src.nombre_pieces), approx = false;
    if (!(n > 0) && w) { const x = q0 / w; if (Math.round(x) >= 1 && Math.abs(x - Math.round(x)) <= 0.1) { n = Math.round(x); approx = true; } }
    if (n > 0) return { qty: n, pu: total != null ? total / n : null, note: `${fmtN(q0, 3)} kg = ${approx ? 'environ ' : ''}${fmtN(n, 0)} article(s)${approx ? ` de ${fmtW(w)}` : ''}` };
  }
  return null;
}
// Boutique écrite sur la ligne : choisie par l'IA, sinon reconnue dans l'observation (« CHATO » → Châteaubriant).
function lineLieu(src) {
  if (S.init.lieux.indexOf(src.lieu) >= 0) return src.lieu;
  const words = normLabel(src.observation).split(' ');
  const hits = S.init.lieux.filter(lx => { const k = normLabel(lx).replace(/ /g, '').slice(0, 4); return k.length === 4 && words.some(w => w.startsWith(k)); });
  return hits.length === 1 ? hits[0] : '';
}

function buildIndex() {
  const byEan = {}, byKey = {};
  S.init.produits.forEach(p => {
    p._tok = new Set(tokens(p.n)); p._tri = trigrams(p.n); p._w = nameWeight(p.n);
    if (p.e && !byEan[p.e]) byEan[p.e] = p;
    if (!byKey[p.k]) byKey[p.k] = p;
  });
  const corr = {};
  S.init.correspondances.forEach(c => {
    corr[c.ref ? `${c.em}|ref|${c.ref}` : `${c.em}|lib|${c.lib}`] = c;
  });
  S.idx = { byEan, byKey, corr };
}

function addFiles(files) {
  const first = S.queue.length;
  Array.from(files).forEach(f => S.queue.push({ file: f, name: f.name, status: 'attente', ov: {}, force: false }));
  // Affiche le nouveau document, sauf si un document est en cours de vérification (il reste affiché, le nouveau est dans la file).
  // (Avant : l'index 0 était repris après « Nouvel import », ce qui réaffichait l'ancien document fermé.)
  const c = cur();
  if (S.queue.length > first && (!c || c.status === 'clos' || c.status === 'genere')) S.current = first;
  render(); runQueue();
}

let running = false;
async function runQueue() {
  if (running) return;
  running = true;
  for (const inv of S.queue) {
    if (inv.status !== 'attente') continue;
    inv.status = 'lecture'; render();
    try {
      const payload = await fileToPayload(inv.file);
      inv.lieu = S.lieu;
      inv.res = await call('analyserFacture', payload, inv.lieu);
      inv.head = {
        emetteur: inv.res.extraction.emetteur || '',
        numero: inv.res.extraction.numero_facture || '',
        date: validIso(inv.res.extraction.date_facture) ? inv.res.extraction.date_facture : '',
        type: inv.res.extraction.type_document === 'bon_de_livraison' ? 'BL' : 'Facture'
      };
      inv.doublon = inv.res.doublon;
      inv.bls = inv.res.bls || {};
      inv.status = 'pret';
      evaluate(inv);
    } catch (err) {
      inv.status = 'erreur'; inv.error = err.message;
    }
    render();
  }
  running = false;
}

// PDF envoyé tel quel ; photo réduite à 2200 px en JPEG (lisible, plus léger, sous la limite de l'IA).
async function fileToPayload(file) {
  const type = (file.type || '').toLowerCase();
  if (type === 'application/pdf') {
    if (file.size > 25 * 1024 * 1024) throw new Error('PDF trop lourd (plus de 25 Mo).');
    return { base64: await readBase64(file), mimeType: 'application/pdf', name: file.name };
  }
  if (!/^image\/(jpeg|png|webp)$/.test(type)) throw new Error('Format non pris en charge : déposez un PDF ou une photo JPG / PNG (les photos iPhone HEIC ne sont pas lues : réglez l\'appareil photo sur « Le plus compatible »).');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Image illisible.')); i.src = url; });
    const scale = Math.min(1, 2200 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return { base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg' };
  } finally { URL.revokeObjectURL(url); }
}
function readBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Lecture du fichier impossible.')); r.readAsDataURL(file); });
}

// =================================================================
//  Rapprochement et alertes (ligne par ligne)
// =================================================================
const prodUnit = (p) => /kilo/i.test(p.u) ? 'KG' : 'U';
const unitLabel = (u) => ({ U: 'article(s)', KG: 'kg', COLIS: 'colis', AUTRE: 'unité inconnue' }[u] || u);

function evaluate(inv) {
  const ex = inv.res.extraction;
  const params = S.init.params;
  const seuil = Number(params['Seuil écart prix (%)']) || 5;
  const em = normEmetteur(inv.head.emetteur);
  const hasBlDates = ex.lignes.some(l => validIso(l.date_livraison));
  const manuscrit = !!ex.document_manuscrit;
  const isBL = inv.head.type === 'BL';
  const bls = inv.bls || {};
  inv.creations = inv.creations || {};
  const pricedLines = ex.lignes.some(l => l.type === 'produit' && num(l.montant_ht) != null);

  inv.lines = ex.lignes.map((src, i) => {
    const ov = inv.ov[i] || (inv.ov[i] = {});
    const L = { i, src, ov, alerts: [], match: null, via: '', coef: null, sugg: [] };
    const q0 = Number(src.quantite), pu0 = num(src.prix_unitaire_ht_net), mt0 = num(src.montant_ht);
    let kind = src.type || 'autre';
    if (kind === 'produit' && ((q0 < 0) || (mt0 != null && mt0 < 0))) kind = 'avoir';
    L.kind = kind;
    if (kind === 'frais' || kind === 'autre' || kind === 'non_livre') return L;
    if (kind === 'avoir') { add(L, 'AVOIR', src.remarque ? 'Motif : ' + src.remarque + '. ' + ALERTS.AVOIR.msg : null); return L; }

    // Livraison déjà entrée en stock (BL importé puis facture récapitulative, ou l'inverse)
    L.bl = isBL ? inv.head.numero : (src.bl_origine || '');
    const deja = bls[normBl(L.bl)];
    if (normBl(L.bl) && deja && !ov.blOk && !inv.forceBl && !(isBL && inv.force)) add(L, 'DEJA_BL', `Le BL n° ${L.bl} a déjà été entré en stock le ${deja.date} (${deja.doc}) : l'importer de nouveau ajouterait la marchandise une 2e fois.`);

    // 0. association pour ce document seulement  1. EAN exact  2. table de correspondance (désignation + format)
    // 3. alerte (suggestions par nom et format, jamais d'association automatique)
    const ean = normEan(src.ean);
    const ref = String(src.ref_fournisseur || '').trim();
    L.w = lineWeight(src);
    L.lieuDoc = lineLieu(src);
    if (ov.manual && (S.init.produits.find(p => p.k === ov.manual.k && p.e === ov.manual.e) || S.idx.byKey[ov.manual.k])) {
      L.match = S.init.produits.find(p => p.k === ov.manual.k && p.e === ov.manual.e) || S.idx.byKey[ov.manual.k]; L.via = 'manuel'; L.coef = ov.manual.coef;
    } else if (ean && S.idx.byEan[ean]) { L.match = S.idx.byEan[ean]; L.via = 'ean'; }
    else {
      const lib = normLabel(src.libelle);
      const keys = ref ? [`${em}|ref|${ref}`] : (L.w ? [`${em}|lib|${lib} @${L.w}`] : []).concat([`${em}|lib|${lib}`]);
      for (const k of keys) {
        const c = S.idx.corr[k], p = c && S.idx.byKey[c.k];
        if (!p) continue;
        // Correspondance mémorisée sans format, vers un autre format que celui lu sur le document (pain 500 g ≠ 1 kg) : écartée.
        // (Une correspondance mémorisée avec son format, « … @0.5 », est un choix explicite : toujours suivie.)
        if (L.w && p._w && !sameWeight(L.w, p._w) && !/ @[\d.]+$/.test(c.lib)) { L.corrConflict = { c, p }; continue; }
        L.match = p; L.via = 'corresp'; L.coef = c.coef; L.corr = c; break;
      }
    }
    L.ckey = creationKey(src);
    if (L.match) delete inv.creations[L.ckey];
    else {
      L.sugg = suggest(src.libelle, 3, L.w);
      const best = L.sugg[0];
      if (inv.creations[L.ckey]) { L.creation = inv.creations[L.ckey]; add(L, 'A_CREER', `Fiche prête : « ${fullName(L.creation)} ». ${ALERTS.A_CREER.msg}`); }
      else if (L.corrConflict) { L.corr = L.corrConflict.c; add(L, 'A_ASSOCIER', `La correspondance mémorisée pointe vers « ${L.corrConflict.p.n} », mais le document indique ${fmtW(L.w)} la pièce : choisissez le produit du bon format.`); }
      else if (ean && best && best.sim >= 0.8 && best.p.e && best.p.e !== ean) add(L, 'NOM_EAN_DIFF', `${ALERTS.NOM_EAN_DIFF.msg} Proche de « ${best.p.n} » (EAN ${best.p.e}).`);
      else if (ean) add(L, 'INCONNU', `EAN ${ean} absent du catalogue. ${ALERTS.INCONNU.msg}`);
      else add(L, 'A_ASSOCIER');
    }

    // Quantité et prix dans l'unité du produit Toporder
    let qty = q0, pu = pu0;
    if (L.match) {
      const pu_ = prodUnit(L.match);
      if (L.coef) { qty = q0 * L.coef; pu = pu0 != null ? pu0 / L.coef : null; }
      else if (src.unite !== pu_) {
        const cv = autoConv(src, L.w, pu_, L.match.n);
        if (cv) { qty = cv.qty; pu = cv.pu; add(L, 'CONVERSION', `Converti : ${cv.note}. Vérifiez la quantité.`); }
        else add(L, 'UNITE', `La facture est en ${unitLabel(src.unite)}, le produit Toporder en ${L.match.u}. Réassociez en indiquant la conversion (ex. 1 colis = 6 articles).`);
      }
    }
    L.qty = ov.qty != null ? ov.qty : (qty != null ? round(qty, 3) : null);
    L.pu = ov.pu != null ? ov.pu : (pu != null ? round(pu, 4) : null);

    // Lecture incertaine / manuscrite / calcul incohérent → validation manuelle
    const reasons = [];
    if (src.confiance === 'basse') reasons.push("l'IA n'a pas pu lire la ligne avec certitude");
    // Filet de sécurité si l'IA a classé en produit une ligne non livrée
    if (NON_LIVRE_RE.test(`${src.libelle || ''} ${src.remarque || ''}`)) reasons.push('la ligne mentionne une rupture / non-livraison : vérifiez que l\'article est bien arrivé');
    else if (src.a_verifier) reasons.push("l'IA signale un doute sur cette ligne");
    if (pu0 == null && mt0 == null && !normEan(src.ean) && pricedLines) reasons.push('ligne sans prix, montant ni code-barres, contrairement aux autres : article peut-être non livré');
    if (manuscrit) reasons.push('facture manuscrite : chaque ligne doit être relue');
    if (!(q0 > 0)) reasons.push('quantité illisible');
    if (pu0 == null && !isBL) reasons.push('prix illisible');
    if (pu0 == null && isBL && ov.pu == null && L.match && !L.match.pa) reasons.push("prix absent du BL et de la fiche Toporder : saisissez-le");
    if (q0 > 0 && pu0 != null && mt0 != null && Math.abs(q0 * pu0 - mt0) > Math.max(0.05, 0.02 * Math.abs(mt0))) reasons.push(`quantité × prix (${fmtN(q0 * pu0)} €) ≠ montant lu (${fmtN(mt0)} €)`);
    if (reasons.length && src.remarque) reasons.push('remarque de lecture : ' + src.remarque);
    if (reasons.length && !ov.validated) add(L, 'CONFIANCE', 'À relire sur la facture : ' + reasons.join(' ; ') + '. Corrigez si besoin puis « Valider ».');
    if (ov.validated && !(L.qty > 0)) add(L, 'CONFIANCE', 'Quantité manquante.');
    if (L.match && L.match.prov) add(L, 'NOUVEAU');

    if (L.match) {
      // Prix (informatif, la ligne reste importée)
      const pa = L.match.pa;
      if (L.pu == null && isBL && pa) { L.pu = pa; add(L, 'PRIX', `Prix absent du BL : prix de la fiche Toporder utilisé (${fmtE(pa)}).`); }
      else if (!pa) add(L, 'PRIX', `Pas de prix d'achat sur la fiche Toporder (facturé ${fmtE(L.pu)}).`);
      else if (L.pu != null && Math.abs(L.pu - pa) / pa * 100 > seuil) add(L, 'PRIX', `Facturé ${fmtE(L.pu)} au lieu de ${fmtE(pa)} sur la fiche (${L.pu > pa ? '+' : ''}${fmtN((L.pu - pa) / pa * 100, 1)} %).`);

      // DLC : facture > saisie > durée de conservation (date de livraison + durée)
      L.dlcSource = '';
      if (ov.dlc) { L.dlc = ov.dlc; L.dlcSource = 'saisie'; }
      else if (validIso(src.dlc)) { L.dlc = src.dlc; L.dlcSource = 'facture'; }
      else {
        const d = S.init.durees[String(L.match.k)] || S.init.durees[L.match.f];
        const base = validIso(src.date_livraison) ? src.date_livraison : (!hasBlDates && inv.head.date ? inv.head.date : '');
        if (d && base) { L.dlc = addDays(base, d); L.dlcSource = `livraison ${isoToFr(base)} + ${d} j`; }
        else L.dlc = '';
      }
      if (!L.dlc && !ov.noDlc) {
        const why = !(S.init.durees[String(L.match.k)] || S.init.durees[L.match.f]) ? '' : " Durée connue mais pas de date de livraison fiable sur cette facture.";
        add(L, 'DLC', ALERTS.DLC.msg + why);
      }

      // Répartition entre lieux
      // Boutique écrite sur la ligne (colonne Observation « CHATO »…) : prioritaire sur la boutique du document.
      L.alloc = ov.alloc ? ov.alloc : [{ lieu: L.lieuDoc || inv.lieu, q: L.qty }];
      if (L.lieuDoc && !ov.alloc && S.init.lieux.length > 1) add(L, 'LIEU', `Le document destine cette ligne à ${lieuLabel(L.lieuDoc)}${src.observation ? ` (« ${src.observation} »)` : ''} : elle y est rangée. Changez la boutique si besoin.`);
      if (ov.alloc) {
        const sum = ov.alloc.reduce((s, a) => s + (Number(a.q) || 0), 0);
        if (Math.abs(sum - (L.qty || 0)) > 0.0005) add(L, 'REPARTITION', `La répartition (${fmtN(sum, 3)}) ne correspond pas à la quantité (${fmtN(L.qty, 3)}).`);
      }
    }
    return L;
  });
  inv.lines.forEach(L => {
    L.blocked = L.alerts.some(a => ALERTS[a.code].block);
    L.included = L.kind === 'produit' && !!L.match && !L.blocked;
  });

  // Contrôle du total : somme des lignes lues vs total HT imprimé
  inv.control = null;
  const t = num(ex.total_ht);
  if (t != null) {
    const amt = (l) => { const m = num(l.montant_ht); const v = m != null ? m : (Number(l.quantite) || 0) * (num(l.prix_unitaire_ht_net) || 0); return l.type === 'avoir' ? -Math.abs(v) : v; };
    const sumBy = (types) => ex.lignes.filter(l => types.indexOf(l.type) >= 0).reduce((s, l) => s + amt(l), 0);
    const tol = Number(params['Tolérance contrôle total (€)']) || 0.10;
    const cands = [sumBy(['produit', 'avoir', 'frais', 'autre']), sumBy(['produit', 'avoir']), sumBy(['produit'])];
    const ok = cands.some(s => Math.abs(s - t) <= tol);
    inv.control = { ok, total: t, sum: cands[1], sumAll: cands[0] };
  }
}
function add(L, code, msg) { L.alerts.push({ code, msg: msg || ALERTS[code].msg }); }

// =================================================================
//  Rendu
// =================================================================
function render() {
  if (!S.init) return;
  renderCatChip();
  const app = $('app');
  const noCat = !S.init.produits.length;
  let html = '';

  if (noCat) {
    html += `<div class="panel"><div class="panel-head"><span class="step-badge">!</span> Importer le catalogue Toporder</div>
      <p style="margin-bottom:12px">Dans Toporder : <b>Stock → Import de stock</b>, téléchargez la matrice (fichier .xlsx), puis déposez-la ici. À refaire après chaque création de produit dans Toporder.</p>
      <button class="btn btn-primary" onclick="document.getElementById('matrixInput').click()">Choisir la matrice .xlsx</button></div>`;
    app.innerHTML = html; return;
  }

  const pending = S.queue.filter(q => q.status === 'pret' || q.status === 'lecture' || q.status === 'attente').length;
  html += `<div class="tabs">
    <button class="tab ${!S.view || S.view === 'factures' ? 'active' : ''}" onclick="setView('factures')">Factures / BL${pending ? ` <span class="count">${pending}</span>` : ''}</button>
    <button class="tab ${S.view === 'dashboard' ? 'active' : ''}" onclick="setView('dashboard')">Tableau de bord</button>
    <button class="tab ${S.view === 'historique' ? 'active' : ''}" onclick="setView('historique')">Historique</button></div>`;
  if (S.view === 'historique' || S.view === 'dashboard') {
    const focus = document.activeElement && document.activeElement.id;
    app.innerHTML = html + (S.view === 'historique' ? renderHistory() : renderDashboard());
    if (S.view === 'dashboard') drawDashChart();
    if (focus && $(focus)) { const f = $(focus); f.focus(); if (f.setSelectionRange && f.type !== 'select-one') f.setSelectionRange(f.value.length, f.value.length); }
    return;
  }

  // Étape 1 : lieu + dépôt
  html += `<div class="panel">
    <div class="panel-head"><span class="step-badge">1</span> Déposer des factures ou des bons de livraison</div>
    <div class="row">
      <div class="field"><label class="label">Boutique qui reçoit la marchandise</label>
        <select id="lieuSel" onchange="setLieu(this.value)">${S.init.lieux.map(l => `<option value="${esc(l)}" ${l === S.lieu ? 'selected' : ''}>${esc(lieuLabel(l))}</option>`).join('')}</select>
      </div>
      <div class="drop" id="drop" onclick="document.getElementById('fileInput').click()">
        <strong>Déposer les factures / BL ici</strong><span class="muted small">ou cliquer pour choisir · PDF ou photo (JPG, PNG)</span>
      </div>
    </div>
    ${S.queue.some(q => q.status !== 'clos') ? `<div class="queue">${S.queue.map((inv, i) => inv.status === 'clos' ? '' : `
      <span class="q-item ${i === S.current ? 'active' : ''}" onclick="selectInv(${i})" title="${esc(inv.name)}">
        <span class="dot ${inv.status}"></span><span class="nm">${esc(inv.head && inv.head.emetteur ? inv.head.emetteur + ' ' + inv.head.numero : inv.name)}</span>
        <span class="muted small">${({ attente: 'en attente', lecture: 'lecture…', pret: 'à vérifier', genere: 'fichier généré', erreur: 'erreur' })[inv.status]}</span>
      </span>`).join('')}</div>` : ''}
  </div>`;

  const inv = S.queue[S.current];
  if (inv && inv.status !== 'clos') html += renderInvoice(inv);
  app.innerHTML = html;
  bindDrop();
}

function renderInvoice(inv) {
  if (inv.status === 'attente' || inv.status === 'lecture') {
    return `<div class="panel loading"><span class="spinner"></span> Lecture de « ${esc(inv.name)} » par l'IA… (20 à 90 secondes)</div>`;
  }
  if (inv.status === 'erreur') {
    return `<div class="panel"><div class="banner error"><div class="grow"><b>« ${esc(inv.name)} » n'a pas pu être lue.</b><br>${esc(inv.error)}</div>
      <button class="btn btn-sm" onclick="retry(${S.current})">Réessayer</button></div></div>`;
  }
  const ex = inv.res.extraction;
  const lines = inv.lines;
  const todo = lines.filter(l => l.kind === 'produit' && !l.included);
  const ok = lines.filter(l => l.included);
  const other = lines.filter(l => l.kind !== 'produit');
  const nbRows = ok.reduce((s, l) => s + l.alloc.filter(a => Number(a.q) > 0).length, 0);
  let h = `<div class="panel">
    <div class="panel-head"><span class="step-badge">2</span> Vérifier ${inv.head.type === 'BL' ? 'le bon de livraison' : 'la facture'} <span class="spacer"></span>
      <a href="#" onclick="viewInvoice();return false" class="small">Voir le document</a>
      <button class="btn btn-sm" onclick="newImport()" title="Fermer ce document et en déposer un autre">+ Nouvel import</button></div>`;

  if (inv.status === 'genere') {
    h += `<div class="banner ok"><div class="grow"><b>Fichier généré.</b> Importez-le dans Toporder : <b>Stock → Import de stock</b>, en mode réapprovisionnement.<br>
      ${inv.result.files.map((f, j) => `<a href="#" onclick="downloadFile(${S.current}, ${j});return false">Télécharger ${esc(f.name)}</a> <span class="small">(${esc(f.lieu.split(' + ').map(lieuLabel).join(' + '))})</span>`).join('<br>')}</div>
      ${S.queue.some(q => q.status === 'pret') ? `<button class="btn btn-primary btn-sm" onclick="newImport()">Document suivant</button>` : `<button class="btn btn-primary btn-sm" onclick="newImport()">+ Nouvel import</button>`}</div>`;
  }

  // En-tête
  h += `<div class="inv-head">
    <div class="field"><label class="label">Fournisseur (émetteur)</label><input type="text" value="${esc(inv.head.emetteur)}" onchange="setHead('emetteur', this.value)"></div>
    <div class="field"><label class="label">Document</label><select onchange="setHead('type', this.value)">${['Facture', 'BL'].map(t => `<option value="${t}" ${t === inv.head.type ? 'selected' : ''}>${t === 'BL' ? 'Bon de livraison' : 'Facture'}</option>`).join('')}</select></div>
    <div class="field"><label class="label">N° ${inv.head.type === 'BL' ? 'BL' : 'facture'}</label><input type="text" value="${esc(inv.head.numero)}" onchange="setHead('numero', this.value)"></div>
    <div class="field"><label class="label">Date ${inv.head.type === 'BL' ? 'BL' : 'facture'}</label><input type="date" value="${esc(inv.head.date)}" onchange="setHead('date', this.value)"></div>
    <div class="field"><label class="label">Boutique</label><select onchange="setInvLieu(this.value)">${S.init.lieux.map(l => `<option value="${esc(l)}" ${l === inv.lieu ? 'selected' : ''}>${esc(lieuLabel(l))}</option>`).join('')}</select></div>
    <div class="field"><label class="label">Total HT</label><div style="padding:7px 0;font-weight:600">${fmtE(num(ex.total_ht))}</div></div>
  </div>
  ${ex.destinataire_adresse ? `<p class="small muted" style="margin:-4px 0 12px">Livré à : ${esc(ex.destinataire_adresse)}</p>` : ''}`;

  // Alertes globales
  if (inv.doublon) {
    h += `<div class="banner error"><div class="grow"><b>${inv.head.type === 'BL' ? 'BL déjà traité' : 'Facture déjà traitée'}</b> le ${esc(inv.doublon.date)} pour cette boutique${inv.doublon.numero ? ` (n° ${esc(inv.doublon.numero)}, ${inv.doublon.lignes} ligne${inv.doublon.lignes > 1 ? 's' : ''} importée${inv.doublon.lignes > 1 ? 's' : ''}${inv.doublon.auteur ? ', par ' + esc(inv.doublon.auteur) : ''})` : ''}.${inv.doublon.id ? ` <a href="#" onclick="showHistoryById('${esc(inv.doublon.id)}');return false">Voir dans l'historique</a>` : ''}
      ${inv.doublon.fichier ? `<a href="${esc(inv.doublon.fichier)}" target="_blank">Voir le fichier</a>` : ''}<br>La réimporter ajouterait le stock une deuxième fois.</div>
      <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${inv.force ? 'checked' : ''} onchange="setForce(this.checked)"> Traiter quand même</label></div>`;
  }
  const dejaBl = lines.filter(l => l.alerts.some(a => a.code === 'DEJA_BL')).length;
  if (dejaBl || inv.forceBl) {
    h += `<div class="banner error"><div class="grow"><b>Livraison déjà entrée en stock.</b> ${dejaBl ? `${dejaBl} ligne${dejaBl > 1 ? 's' : ''} provien${dejaBl > 1 ? 'nent' : 't'} d'un BL déjà importé (le BL lui-même ou une facture qui le reprend).` : 'Contrôle levé pour toutes les lignes.'}
      Évitez d'importer à la fois le BL et la facture d'une même livraison.</div>
      <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${inv.forceBl ? 'checked' : ''} onchange="cur().forceBl=this.checked;refresh()"> Importer quand même toutes les lignes</label></div>`;
  }
  const byLieu = {};
  lines.filter(l => l.kind === 'produit' && l.lieuDoc).forEach(l => { (byLieu[l.lieuDoc] = byLieu[l.lieuDoc] || []).push(l); });
  if (Object.keys(byLieu).length && S.init.lieux.length > 1) {
    const mentions = (ls) => [...new Set(ls.map(l => String(l.src.observation || '').trim()).filter(Boolean))].map(m => `« ${esc(m)} »`).join(', ');
    const rest = lines.filter(l => l.kind === 'produit' && !l.lieuDoc).length;
    h += `<div class="banner info"><div class="grow"><b>Livraison pour plusieurs boutiques.</b> ${Object.entries(byLieu).map(([lx, ls]) => `${ls.length} ligne${ls.length > 1 ? 's' : ''} pour <b>${esc(lieuLabel(lx))}</b>${mentions(ls) ? ' (' + mentions(ls) + ')' : ''}`).join(' · ')}${rest ? ` · ${rest} sans mention → <b>${esc(lieuLabel(inv.lieu))}</b> (boutique du document)` : ''}.
      Chaque ligne est rangée dans sa boutique ; un même produit sur deux lignes est importé dans les deux.</div></div>`;
  }
  const pts = (ex.points_attention || []).filter(p => String(p || '').trim());
  if (ex.document_manuscrit) h +=`<div class="banner warn"><div class="grow"><b>Facture manuscrite.</b> Relisez et validez chaque ligne avec la facture sous les yeux.</div></div>`;
  if (!inv.head.date) h += `<div class="banner warn"><div class="grow"><b>Date du document non lue.</b> Saisissez-la ci-dessus.</div></div>`;
  if (inv.control && !inv.control.ok) {
    h += `<div class="banner warn"><div class="grow"><b>Contrôle du total : écart.</b> Les lignes lues totalisent ${fmtE(inv.control.sum)} (${fmtE(inv.control.sumAll)} avec frais) pour un total HT facture de ${fmtE(inv.control.total)}.
      Une ligne a peut-être été oubliée ou mal lue.</div><button class="btn btn-sm btn-primary" onclick="openControle()">Contrôle approfondi</button></div>`;
  } else if (inv.control) {
    h += `<div class="banner ok"><div class="grow">Contrôle du total : les lignes lues correspondent au total HT de la facture.</div><button class="btn btn-sm" onclick="openControle()">Contrôle approfondi</button></div>`;
  } else if (inv.head.type !== 'BL') {
    h += `<div class="banner warn"><div class="grow">Total HT non lu sur la facture : contrôle impossible.</div><button class="btn btn-sm" onclick="openControle()">Contrôle approfondi</button></div>`;
  }

  const nbCrea = Object.keys(inv.creations).length;
  if (nbCrea && inv.status !== 'genere') {
    h += `<div class="banner info"><div class="grow"><b>${nbCrea} produit${nbCrea > 1 ? 's' : ''} à créer dans Toporder</b> : ${Object.values(inv.creations).map(c => esc(fullName(c))).join(', ')}.
      ${inv.creationFile ? `<br>Fichier généré (<a href="#" onclick="download(cur().creationFile);return false">retélécharger</a>). Une fois importé dans Toporder, <a href="#" onclick="showCreateSteps();return false">importez la nouvelle matrice</a> (elle donne la Clé Toporder des nouveaux produits).` : ''}</div>
      <button class="btn btn-primary btn-sm" onclick="generateCreation()">${inv.creationFile ? 'Regénérer' : 'Générer'} le fichier de création</button></div>`;
  }

  // Compteurs cliquables : une seule liste affichée à la fois
  const counts = { todo: todo.length, ok: ok.length, other: other.length, notes: pts.length };
  if (!counts[inv.tab]) inv.tab = ['todo', 'ok', 'other', 'notes'].find(k => counts[k]) || 'ok';
  const chip = (k, cls, label) => counts[k] || k !== 'notes'
    ? `<button type="button" class="stat ${cls}${inv.tab === k ? ' active' : ''}" ${counts[k] ? `onclick="cur().tab='${k}';refresh()"` : 'disabled'}><b>${counts[k]}</b> ${label}</button>` : '';
  h += `<div class="stats">
    ${chip('ok', 'ok', 'prêtes à importer')}
    ${chip('todo', 'warn', 'à vérifier')}
    ${chip('other', 'muted', 'non importées')}
    ${chip('notes', 'muted', `remarque${pts.length > 1 ? 's' : ''} sur le document`)}
  </div>`;

  if (inv.tab === 'todo' && todo.length) {
    const dlcOnly = todo.filter(l => l.alerts.every(a => a.code === 'DLC' || !ALERTS[a.code].block));
    if (dlcOnly.length > 1) h += `<div class="group-title"><button class="btn btn-sm" onclick="allNoDlc()">Importer les ${dlcOnly.length} lignes sans DLC</button></div>`;
    h += table(todo, inv);
  }
  if (inv.tab === 'ok' && ok.length) h += table(ok, inv);
  if (inv.tab === 'other' && other.length) {
    h += `<div class="table-wrap"><table><thead><tr><th>Raison</th><th>Ligne du document</th><th>Qté</th><th>Montant HT</th><th>Détail</th></tr></thead><tbody>
      ${other.map(l => `<tr><td><span class="badge ${l.kind === 'avoir' ? 'block' : l.kind === 'non_livre' ? 'info' : 'grey'}">${esc(KIND_LABEL[l.kind] || l.kind)}</span></td><td class="lib">${esc(l.src.libelle)}</td>
      <td>${fmtN(l.src.quantite, 3)}</td><td>${fmtE(num(l.src.montant_ht))}</td><td class="small">${l.kind === 'non_livre' ? esc(l.src.remarque || 'Commandé mais non livré') : esc(kindMotif(l)) + (l.src.remarque ? '<br>' + esc(l.src.remarque) : '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if (inv.tab === 'notes' && pts.length) {
    h += `<div class="table-wrap"><table><tbody>${pts.map(p => `<tr><td class="small">${esc(p)}</td></tr>`).join('')}</tbody></table></div>`;
  }

  if (inv.status !== 'genere') {
    const blocked = inv.doublon && !inv.force;
    h += `<div class="gen-bar"><div class="grow">${nbRows ? `<b>${nbRows}</b> ligne${nbRows > 1 ? 's' : ''} dans le fichier` : 'Aucune ligne prête'}${todo.length ? ` · <span style="color:var(--warn)">${todo.length} à vérifier ne seront pas importées</span>` : ''}</div>
      <button class="btn btn-primary btn-lg" id="genBtn" ${(!nbRows || blocked || !inv.head.date) ? 'disabled' : ''} onclick="generate()">Générer le fichier d'import</button></div>`;
  }
  h += `</div>`;
  return h;
}

function table(lines, inv) {
  const multi = S.init.lieux.length > 1;
  return `<div class="table-wrap"><table><thead><tr>
    <th style="width:20%">Ligne facture</th><th style="width:22%">Produit Toporder</th><th>Qté</th><th>PU HT net</th><th>DLC</th>${multi ? '<th>Lieu</th>' : ''}<th>Statut</th>
  </tr></thead><tbody>${lines.map(l => row(l, inv, multi)).join('')}</tbody></table></div>`;
}

function row(L, inv, multi) {
  const s = L.src, m = L.match, done = inv.status === 'genere';
  const dis = done ? 'disabled' : '';
  const sub = [s.ref_fournisseur ? 'Réf. ' + s.ref_fournisseur : '', s.ean ? 'EAN ' + s.ean : '', s.marque || '',
    validIso(s.date_livraison) ? 'livré le ' + isoToFr(s.date_livraison) : '', s.observation ? 'Obs. : ' + s.observation : ''].filter(Boolean).join(' · ');
  const poids = [num(s.poids_total_kg) > 0 && s.unite !== 'KG' ? fmtN(num(s.poids_total_kg), 3) + ' kg' : '', num(s.nombre_pieces) > 0 && s.unite !== 'U' ? fmtN(num(s.nombre_pieces), 0) + ' pièce(s)' : '',
    L.w ? fmtW(L.w) + ' la pièce' : ''].filter(Boolean).join(', ');
  const facture = `${fmtN(s.quantite, 3)} ${unitLabel(s.unite)}${poids ? ' (' + poids + ')' : ''} × ${fmtE(num(s.prix_unitaire_ht_net))}`;
  const via = { ean: 'par code-barres', corresp: 'correspondance mémorisée', manuel: 'associé pour ce document seulement' }[L.via] || '';
  const forget = L.corr && !done ? `<button class="btn-link" onclick="forgetCorr(${L.i})">Oublier l'association mémorisée</button>` : '';
  let prod;
  if (m) {
    prod = `<div class="prod">${esc(m.n)}</div><div class="sub">${esc(m.u)}${m.e ? ' · EAN ' + m.e : ''} · ${via}${L.coef ? ' · ×' + fmtN(L.coef, 3) : ''}</div>
      ${!done ? `<div class="actions"><button class="btn-link" onclick="openAssoc(${L.i})">Changer</button>${forget}</div>` : ''}`;
  } else if (L.creation) {
    prod = `<div class="prod">${esc(fullName(L.creation))}</div><div class="sub">à créer · ${esc(L.creation.cat)} · PV ${fmtE(L.creation.pv)}</div>
      ${!done ? `<div class="actions" style="margin-top:4px"><button class="btn-link" onclick="openCreate(${L.i})">Modifier la fiche</button>
        <button class="btn-link" onclick="cancelCreate(${L.i})">Annuler la création</button>
        <button class="btn-link" onclick="openAssoc(${L.i})">Déjà dans Toporder : l'associer</button></div>` : ''}`;
  } else {
    prod = `<div class="prod none">Aucun produit</div>${L.sugg.length ? `<div class="sub">Proche : ${L.sugg.map(x => esc(x.p.n)).join(' · ')}</div>` : ''}
      ${!done ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px"><button class="btn btn-sm btn-primary" onclick="openAssoc(${L.i})">Associer</button>
        <button class="btn btn-sm" onclick="openCreate(${L.i})">Créer dans Toporder</button></div>${forget ? '<div>' + forget + '</div>' : ''}` : ''}`;
  }
  const qty = m ? `<input type="text" inputmode="decimal" value="${fmtN(L.qty, 3)}" ${dis} onchange="setOv(${L.i}, 'qty', this.value)"><div class="sub">${esc(m.u)}</div>` : `<span class="sub">${facture}</span>`;
  const pu = m ? `<input type="text" inputmode="decimal" value="${fmtN(L.pu, 4)}" ${dis} onchange="setOv(${L.i}, 'pu', this.value)">${m.pa ? `<div class="sub">fiche ${fmtE(m.pa)}</div>` : ''}` : '';
  let dlc = '';
  if (m) {
    dlc = `<input type="date" value="${esc(L.dlc || '')}" ${dis} onchange="setOv(${L.i}, 'dlc', this.value)">
      <div class="sub">${L.dlcSource ? esc(L.dlcSource) : (L.ov.noDlc ? 'importée sans DLC' : '')}</div>
      ${!done && !L.dlc ? `<div class="actions" style="margin-top:4px"><button class="btn-link" onclick="askDuree(${L.i})">Durée de conservation…</button>
        ${!L.ov.noDlc ? `<button class="btn-link" onclick="setOv(${L.i}, 'noDlc', true)">Sans DLC</button>` : `<button class="btn-link" onclick="setOv(${L.i}, 'noDlc', false)">Annuler « sans DLC »</button>`}</div>` : ''}`;
  }
  let lieu = '';
  if (multi && m) {
    if (L.ov.alloc) {
      lieu = `<div class="alloc">${S.init.lieux.map((lx, j) => { const a = L.ov.alloc.find(x => x.lieu === lx); return `<label><input type="text" inputmode="decimal" value="${a ? fmtN(a.q, 3) : ''}" ${dis} onchange="setAlloc(${L.i}, ${j}, this.value)">${esc(lx)}</label>`; }).join('')}</div>
        ${!done ? `<button class="btn-link" onclick="setOv(${L.i}, 'alloc', null)">Un seul lieu</button>` : ''}`;
    } else {
      lieu = `<select ${dis} onchange="setLineLieu(${L.i}, this.value)">${S.init.lieux.map(lx => `<option ${lx === L.alloc[0].lieu ? 'selected' : ''}>${esc(lx)}</option>`).join('')}</select>
        ${!done ? `<div><button class="btn-link" onclick="startAlloc(${L.i})">Répartir</button></div>` : ''}`;
    }
  }
  const badges = L.alerts.length ? L.alerts.map(a => `<span class="badge ${ALERTS[a.code].block ? 'block' : 'info'}">${esc(ALERTS[a.code].label)}</span>`).join('') : '<span class="badge ok">OK</span>';
  const msgs = L.alerts.map(a => `<div class="msg ${ALERTS[a.code].block ? 'block' : 'info'}">${esc(a.msg)}</div>`).join('');
  const validate = (L.alerts.some(a => a.code === 'CONFIANCE') && !done ? `<button class="btn btn-sm" style="margin-top:6px" onclick="setOv(${L.i}, 'validated', true)">Valider la ligne</button>` : '')
    + (L.alerts.some(a => a.code === 'DEJA_BL') && !done ? `<button class="btn btn-sm" style="margin-top:6px" onclick="setOv(${L.i}, 'blOk', true)">Importer quand même</button>` : '');
  return `<tr>
    <td><div class="lib">${esc(s.libelle)}</div><div class="sub">${esc(sub)}</div><div class="sub">Facture : ${facture}${s.dlc ? ' · DLC ' + isoToFr(s.dlc) : ''}</div></td>
    <td>${prod}</td><td class="num">${qty}</td><td class="num">${pu}</td><td>${dlc}</td>${multi ? `<td>${lieu}</td>` : ''}
    <td style="min-width:200px">${badges}${msgs}${validate}</td></tr>`;
}

// =================================================================
//  Actions
// =================================================================
function cur() { return S.queue[S.current]; }
function refresh() { const inv = cur(); if (inv && inv.status === 'pret') evaluate(inv); render(); }

function setLieu(v) { S.lieu = v; store('gm_lieu', v); }
function selectInv(i) { S.current = i; render(); if (cur() && cur().status === 'pret') checkDoublon(); }
function nextInv() { const i = S.queue.findIndex(q => q.status === 'pret'); if (i >= 0) { S.current = i; render(); window.scrollTo(0, 0); } }
function retry(i) { S.queue[i].status = 'attente'; render(); runQueue(); }
function setForce(v) { cur().force = v; render(); }

function setOv(i, key, val) {
  const ov = cur().ov[i];
  if (key === 'qty' || key === 'pu') {
    const n = num(val);
    if (n == null && val !== '') { toast('Nombre invalide'); render(); return; }
    ov[key] = val === '' ? null : n;
    if (key === 'qty') ov.alloc = null;
  } else if (key === 'dlc') {
    ov.dlc = validIso(val) ? val : null;
  } else ov[key] = val;
  refresh();
}
function setLineLieu(i, lieu) { const L = cur().lines[i]; cur().ov[i].alloc = [{ lieu, q: L.qty }]; refresh(); }
function startAlloc(i) { const L = cur().lines[i]; cur().ov[i].alloc = S.init.lieux.map(lx => ({ lieu: lx, q: lx === L.alloc[0].lieu ? L.qty : 0 })); refresh(); }
function setAlloc(i, j, val) {
  const ov = cur().ov[i]; const a = ov.alloc.find(x => x.lieu === S.init.lieux[j]);
  a.q = num(val) || 0; refresh();
}
function allNoDlc() { cur().lines.forEach(L => { if (L.alerts.some(a => a.code === 'DLC')) cur().ov[L.i].noDlc = true; }); refresh(); }

function setHead(k, v) {
  const inv = cur(); inv.head[k] = v;
  if (k === 'date' && !validIso(v)) inv.head.date = '';
  refresh();
  if (k === 'emetteur' || k === 'numero') checkDoublon();
}
function setInvLieu(v) {
  const inv = cur(); inv.lieu = v;
  Object.values(inv.ov).forEach(ov => { if (ov.alloc && ov.alloc.length === 1) ov.alloc = null; });
  refresh(); checkDoublon();
}
function checkDoublon() {
  const inv = cur();
  call('verifierDoublon', inv.head.emetteur, inv.head.numero, inv.lieu).then(r => {
    inv.doublon = r.doublon; inv.bls = r.bls || {}; if (!r.doublon) inv.force = false; refresh();
  }).catch(() => {});
}

// ── Association à un produit Toporder ──────────────────────────────
let A = null;
function openAssoc(i) {
  const L = cur().lines[i];
  A = { i, sel: L.match || null, q: L.creation ? fullName(L.creation) : '', coef: L.coef || '' };
  if (!L.sugg.length) L.sugg = suggest(L.src.libelle, 5, L.w);
  drawAssoc();
}
function drawAssoc() {
  const L = cur().lines[A.i], s = L.src;
  const list = assocList();
  const needCoef = assocNeedsCoef();
  $('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Associer à un produit Toporder</h3>
    <p class="small muted">Facture ${esc(cur().head.emetteur)} : <b>${esc(s.libelle)}</b>${s.ref_fournisseur ? ' · réf. ' + esc(s.ref_fournisseur) : ''}${s.ean ? ' · EAN ' + esc(s.ean) : ''} — ${fmtN(s.quantite, 3)} ${unitLabel(s.unite)}${L.w ? ` · <b>${fmtW(L.w)} la pièce</b> (lu sur le document)` : ''}${s.observation ? ' · obs. « ' + esc(s.observation) + ' »' : ''}</p>
    <input type="search" id="assocQ" placeholder="Rechercher par nom ou code-barres…" value="${esc(A.q)}" style="width:100%;margin-top:12px" oninput="A.q=this.value;drawAssocList()">
    <div class="results" id="assocList">${listHtml(list)}</div>
    <div id="assocCoef">${coefHtml(needCoef)}</div>
    <p class="small muted" style="margin-top:10px"><b>Associer et mémoriser</b> : les prochains documents de ce fournisseur reconnaîtront cette ligne automatiquement (même désignation${L.w ? ' et même format, ' + fmtW(L.w) : ''}).
      <b>Associer pour ce document</b> : rien n'est retenu, à utiliser si la désignation peut correspondre à plusieurs produits.</p>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn" id="assocOnce" ${A.sel ? '' : 'disabled'} onclick="saveAssoc(false)">Associer pour ce document</button>
      <button class="btn btn-primary" id="assocOk" ${A.sel ? '' : 'disabled'} onclick="saveAssoc(true)">Associer et mémoriser</button></div>
  </div></div>`;
  const q = $('assocQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
}
// Résultats de la recherche, sinon les produits proposés ; le produit choisi reste toujours visible (en surbrillance).
function assocList() {
  const L = cur().lines[A.i];
  const list = A.q.trim() ? search(A.q) : L.sugg.map(x => x.p);
  if (A.sel && !list.some(p => p.k === A.sel.k && p.e === A.sel.e)) list.unshift(A.sel);
  return list;
}
function drawAssocList() { $('assocList').innerHTML = listHtml(assocList()); }
function listHtml(list) {
  if (!list.length) return `<div class="res muted">${A.q ? 'Aucun produit trouvé.' : 'Tapez un nom ou un code-barres.'}</div>`;
  return list.map(p => `<div class="res ${A.sel && A.sel.k === p.k && A.sel.e === p.e ? 'sel' : ''}" onclick="pickAssoc(${p.k}, '${p.e}')">
    <div class="prod">${esc(p.n)}</div><div class="sub">${esc(p.u)}${p.e ? ' · EAN ' + p.e : ''} · ${esc(p.f)}${p.pa ? ' · ' + fmtE(p.pa) : ''} · Clé ${p.k}</div></div>`).join('');
}
// Conversion à saisir : unités différentes et pas de poids / nombre de pièces sur le document pour la déduire.
function assocNeedsCoef() {
  if (!A.sel) return false;
  const L = cur().lines[A.i], pu_ = prodUnit(A.sel);
  return L.src.unite !== pu_ && !autoConv(L.src, L.w, pu_, A.sel.n);
}
function coefHtml(need) {
  const L = cur().lines[A.i], s = L.src;
  const pw = A.sel && A.sel._w;
  const fmt = pw && L.w && !sameWeight(pw, L.w) ? `<div class="banner warn" style="margin-top:12px"><div class="grow">Attention : ce produit fait <b>${fmtW(pw)}</b>, le document indique <b>${fmtW(L.w)}</b> la pièce.</div></div>` : '';
  if (!need) return fmt;
  return fmt + `<div class="banner warn" style="margin-top:12px"><div class="grow">La facture est en <b>${unitLabel(s.unite)}</b>, ce produit en <b>${esc(A.sel.u)}</b>. Indiquez la conversion :<br>
    1 ${unitLabel(s.unite).replace(/\(s\)/, '')} = <input type="text" inputmode="decimal" id="coefIn" value="${esc(A.coef)}" style="width:80px" oninput="A.coef=this.value"> ${esc(A.sel.u)}</div></div>`;
}
function search(q) {
  const d = q.replace(/\D/g, '');
  if (d.length >= 6 && d.length === q.replace(/\s/g, '').length) return S.init.produits.filter(p => p.e && p.e.indexOf(d) >= 0).slice(0, 30);
  const words = normLabel(q).split(' ').filter(Boolean);
  return S.init.produits.filter(p => { const n = normLabel(p.n + ' ' + p.f); return words.every(w => n.indexOf(w) >= 0); }).slice(0, 30);
}
function pickAssoc(k, e) {
  A.sel = S.init.produits.find(p => p.k === k && p.e === e);
  drawAssocList();
  $('assocCoef').innerHTML = coefHtml(assocNeedsCoef());
  $('assocOk').disabled = false; $('assocOnce').disabled = false;
}
function closeModal() { $('modalRoot').innerHTML = ''; A = null; }
// memo = true : association mémorisée (désignation + format) ; false : pour ce document seulement.
async function saveAssoc(memo) {
  const inv = cur(), L = inv.lines[A.i], s = L.src;
  const needCoef = assocNeedsCoef();
  const coef = needCoef ? num(A.coef) : null;
  if (needCoef && !(coef > 0)) { toast('Indiquez la conversion (nombre positif)'); return; }
  // Ligne reconnue sur un produit créé depuis l'appli (provisoire) et associée à son vrai produit Toporder :
  // le provisoire est remplacé partout par la vraie Clé (correspondances, durées, historique) et disparaît.
  if (L.match && L.match.prov && !A.sel.prov) {
    try { S.init = await call('resoudreProvisoire', L.match.k, A.sel.k); buildIndex(); }
    catch (err) { showError('Association impossible', err); return; }
  }
  if (!memo) {
    inv.ov[A.i] = { manual: { k: A.sel.k, e: A.sel.e, coef } };
    closeModal(); S.queue.forEach(q => { if (q.status === 'pret' && q !== inv) evaluate(q); }); refresh(); return;
  }
  $('assocOk').disabled = true; $('assocOnce').disabled = true; $('assocOk').textContent = 'Enregistrement…';
  try {
    S.init.correspondances = await call('enregistrerCorrespondance', {
      emetteur: inv.head.emetteur, ref: s.ref_fournisseur || '', libelle: s.libelle, poids: L.w, cle: A.sel.k, produit: A.sel.n, coef
    });
    buildIndex();
    // Une ligne associée par EAN ne passe pas par la table : on force le produit choisi pour cette facture.
    const ean = normEan(s.ean);
    if (ean && S.idx.byEan[ean] && S.idx.byEan[ean].k !== A.sel.k) toast("Attention : ce code-barres existe déjà dans Toporder, il reste prioritaire.");
    inv.ov[A.i] = {};
    closeModal(); refresh();
  } catch (err) {
    showError('Association impossible', err);
    $('assocOk').disabled = false; $('assocOnce').disabled = false; $('assocOk').textContent = 'Associer et mémoriser';
  }
}
// Supprime la correspondance mémorisée qui a servi (ou a été écartée) pour cette ligne.
async function forgetCorr(i) {
  const L = cur().lines[i], c = L.corr;
  if (!c) return;
  const p = S.idx.byKey[c.k];
  const ok = await dialog({ title: "Oublier l'association mémorisée ?", tone: 'warn', ok: 'Oublier', cancel: 'Annuler',
    body: `<p>« ${esc(L.src.libelle)} » (${esc(cur().head.emetteur)}) ne sera plus associé automatiquement à « ${esc(p ? p.n : 'Clé ' + c.k)} ».</p><p class="small muted">Les documents déjà importés ne changent pas.</p>` });
  if (!ok) return;
  try {
    S.init.correspondances = await call('supprimerCorrespondance', { em: c.em, ref: c.ref, lib: c.lib });
    buildIndex();
    if (cur().ov[i]) delete cur().ov[i].manual;
    S.queue.forEach(q => { if (q.status === 'pret') evaluate(q); });
    render(); toast('Association oubliée');
  } catch (err) { showError('Suppression impossible', err); }
}

// ── Contrôle approfondi ────────────────────────────────────────────
// 1. Analyse immédiate dans l'appli (sommes, lignes incohérentes, ligne du montant de l'écart, écarts de prix avec la fiche).
// 2. Relecture du document par l'IA, qui compare avec ce qui a été lu et propose des corrections (appliquées ligne par ligne).
function openControle() {
  const inv = cur();
  inv.controle = inv.controle || { status: '', report: null, done: {} };
  drawControle();
}
function lineAmount(l) {
  const m = num(l.montant_ht); const v = m != null ? m : (Number(l.quantite) || 0) * (num(l.prix_unitaire_ht_net) || 0);
  return l.type === 'avoir' ? -Math.abs(v) : v;
}
function localControle(inv) {
  const ex = inv.res.extraction, ls = ex.lignes;
  const sum = (types) => ls.filter(l => types.indexOf(l.type) >= 0).reduce((s, l) => s + lineAmount(l), 0);
  const t = num(ex.total_ht);
  const sums = { produit: sum(['produit']), avoir: sum(['avoir']), frais: sum(['frais']), autre: sum(['autre']), non_livre: sum(['non_livre']) };
  const base = sums.produit + sums.avoir;
  const gap = t != null ? round(t - base, 2) : null;
  const incoh = ls.map((l, i) => ({ l, i })).filter(({ l }) => {
    const q = Number(l.quantite), pu = num(l.prix_unitaire_ht_net), mt = num(l.montant_ht);
    return q > 0 && pu != null && mt != null && Math.abs(q * pu - Math.abs(mt)) > Math.max(0.05, 0.02 * Math.abs(mt));
  });
  const match = gap ? ls.map((l, i) => ({ l, i })).filter(({ l }) => { const a = Math.abs(lineAmount(l)); return a > 0 && Math.abs(a - Math.abs(gap)) <= 0.01; }) : [];
  const seuil = Number(S.init.params['Seuil écart prix (%)']) || 5;
  const prix = inv.lines.filter(L => L.match && L.match.pa && L.pu != null && num(L.src.prix_unitaire_ht_net) != null)
    .map(L => ({ L, pct: (L.pu - L.match.pa) / L.match.pa * 100 })).filter(x => Math.abs(x.pct) > seuil)
    .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
  return { t, sums, base, gap, incoh, match, prix, seuil };
}
function drawControle() {
  const inv = cur(), C = inv.controle, A_ = localControle(inv), ex = inv.res.extraction;
  const lib = (i) => esc((ex.lignes[i] || {}).libelle || '');
  let h = `<h3>Contrôle approfondi — ${esc(inv.head.emetteur)} n° ${esc(inv.head.numero)}</h3>`;
  // Analyse immédiate
  h += `<div class="group-title" style="margin-top:12px">Ce que l'appli a lu</div><div class="table-wrap"><table><tbody>
    <tr><td>Produits livrés</td><td class="num">${fmtE(A_.sums.produit)}</td></tr>
    ${A_.sums.avoir ? `<tr><td>Avoirs</td><td class="num">${fmtE(A_.sums.avoir)}</td></tr>` : ''}
    ${A_.sums.frais ? `<tr><td>Frais / taxes</td><td class="num">${fmtE(A_.sums.frais)}</td></tr>` : ''}
    ${A_.sums.autre ? `<tr><td>Autres lignes chiffrées</td><td class="num">${fmtE(A_.sums.autre)}</td></tr>` : ''}
    ${A_.sums.non_livre ? `<tr><td class="muted">Non livrés (hors total)</td><td class="num muted">${fmtE(A_.sums.non_livre)}</td></tr>` : ''}
    <tr><td><b>Total HT imprimé</b></td><td class="num"><b>${fmtE(A_.t)}</b></td></tr>
    ${A_.gap != null ? `<tr><td><b>Écart</b> (total imprimé − produits − avoirs)</td><td class="num"><b style="color:${Math.abs(A_.gap) > 0.1 ? 'var(--warn)' : 'var(--ok)'}">${A_.gap > 0 ? '+' : ''}${fmtE(A_.gap)}</b></td></tr>` : ''}
  </tbody></table></div>`;
  const hints = [];
  if (A_.gap != null && Math.abs(A_.gap) > 0.1) {
    if (A_.gap > 0) hints.push(`Il manque ${fmtE(A_.gap)} dans les lignes lues : une ligne oubliée, une quantité ou un prix lu trop bas, ou des frais compris dans le total.`);
    else hints.push(`Les lignes lues dépassent le total de ${fmtE(-A_.gap)} : une ligne lue en double, un prix lu trop haut, ou une remise de pied de facture.`);
    if (A_.sums.frais && Math.abs(A_.gap - A_.sums.frais) > 0.1 && Math.abs(A_.gap) < Math.abs(A_.sums.frais)) hints.push(`Les frais (${fmtE(A_.sums.frais)}) ne sont peut-être comptés qu'en partie dans le total HT.`);
  }
  A_.match.forEach(({ l, i }) => hints.push(`La ligne « ${lib(i)} » (${l.type}) fait exactement ${fmtE(Math.abs(lineAmount(l)))}, le montant de l'écart : à vérifier en priorité.`));
  A_.incoh.forEach(({ l, i }) => hints.push(`« ${lib(i)} » : ${fmtN(l.quantite, 3)} × ${fmtE(num(l.prix_unitaire_ht_net))} = ${fmtE(Number(l.quantite) * num(l.prix_unitaire_ht_net))}, mais montant lu ${fmtE(num(l.montant_ht))}.`));
  if (hints.length) h += `<ul class="small" style="margin:8px 0 0 18px">${hints.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  if (A_.prix.length) {

  if (f.groupe && !f.attribut) errs.push(`Indiquez ${ATTR_TYPES[f.groupe].ask.toLowerCase()}, ou choisissez le format « aucun ».`);
  const others = Object.entries(inv.creations).filter(([k]) => k !== L.ckey).map(([, c]) => c);
  if (f.ean) {
    const e = normEan(f.ean);
    if (!e) errs.push('Code-barres invalide (8 à 13 chiffres).');
    else if (S.idx.byEan[e]) errs.push(`Ce code-barres existe déjà dans Toporder : « ${S.idx.byEan[e].n} ». Utilisez plutôt « Associer ».`);
    else if (others.some(c => normEan(c.ean) === e)) errs.push('Ce code-barres est déjà utilisé par une autre fiche de cette facture.');
  }
  if (/kilo/i.test(f.unite)) {
    const p = Number(f.plu);
    if (p > 0 && (S.init.produits.some(x => Number(x.plu) === p) || others.some(c => Number(c.plu) === p))) errs.push(`Le code PLU ${p} est déjà utilisé.`);
  }
  const same = S.init.produits.find(p => normLabel(p.n) === normLabel(fullName(f)));
  if (same) errs.push(`Un produit « ${same.n} » existe déjà : utilisez « Associer », ou changez le nom.`);
  if (errs.length) { $('crErr').innerHTML = `<div class="banner error"><div class="grow">${errs.map(esc).join('<br>')}</div></div>`; return; }
  inv.creations[L.ckey] = f;
  inv.creationFile = null; inv.creationDone = false;
  closeModal(); refresh();
}
