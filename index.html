// Après une mise à jour du catalogue : les produits créés avec un EAN sont reconnus d'eux-mêmes ;
// ceux sans EAN sont retrouvés par leur nom exact (créé à l'instant pour cette ligne) et la correspondance est mémorisée.
// Produit du catalogue retrouvé par son nom : exact (nom + format, ou nom seul), sinon unique produit dont le nom
// contient tous les mots (Toporder peut présenter « nom + attribut » un peu autrement), même fournisseur de préférence.
function findByName(full, nom, fourn) {
  const real = S.init.produits.filter(p => !p.prov);
  const one = (hits) => [...new Set(hits.map(p => p.k))].length === 1 ? hits[0] : null;
  const exact = (x) => x ? one(real.filter(p => normLabel(p.n) === normLabel(x))) : null;
  const p = exact(full) || exact(nom);
  if (p) return p;
  const w = normLabel(full).split(' ').filter(Boolean);
  if (!w.length) return null;
  const hits = real.filter(p => { const n = ' ' + normLabel(p.n) + ' '; return w.every(x => n.indexOf(' ' + x + ' ') >= 0); });
  const same = fourn ? hits.filter(p => normLabel(p.f) === normLabel(fourn)) : [];
  return one(same.length ? same : hits);
}
async function linkCreatedProducts() {
  let n = 0;
  for (const inv of S.queue) {
    if (inv.status !== 'pret' || !inv.creations) continue;
    for (const c of Object.values(inv.creations)) {
      const e = normEan(c.ean);
      if (e && S.idx.byEan[e] && !S.idx.byEan[e].prov) { n++; continue; }
      const p = findByName(fullName(c), c.nom, c.fournisseur);
      if (!p) continue;
      S.init.correspondances = await call('enregistrerCorrespondance', {
        emetteur: inv.head.emetteur, ref: c.src.ref, libelle: c.src.libelle, poids: c.src.poids, cle: p.k, produit: p.n, coef: null
      });
      buildIndex(); n++;
    }
  }
  return n;
}

// ── Génération du fichier ──────────────────────────────────────────
// Retourne true si le fichier a été généré (et l'import enregistré dans l'historique).
async function generate() {
  const inv = cur();
  const lignes = [];
  inv.lines.filter(l => l.included).forEach(L => L.alloc.forEach(a => {
    if (Number(a.q) > 0) lignes.push({ cle: L.match.k, ean: L.match.e, lieu: a.lieu, qte: Number(a.q), pu: L.pu || 0, dlc: isoToFr(L.dlc) });
  }));
  // Produit à créer dont le fichier de création n'a pas été téléchargé : à faire avant, sinon il n'entrera jamais en stock.
  const crea = Object.values(inv.creations || {});
  if (crea.length && !inv.creationFile) {
    const go = await dialog({
      title: 'Fichier de création non téléchargé', tone: 'warn',
      body: `<p>Attention, vous n'avez pas téléchargé le fichier de création ${crea.length > 1 ? `des ${crea.length} produits créés` : 'du produit créé'} (${crea.map(c => esc(fullName(c))).join(', ')}).</p>
        <p>Faites-le avant de générer le fichier d'import, pour que le stock soit correctement mis à jour.</p>`,
      ok: 'Générer le fichier de création', cancel: 'Annuler'
    });
    if (go === true) await generateCreation();
    return false;
  }
  if (crea.length) {
    const go = await dialog({
      title: 'Nouvelle matrice à importer', tone: 'warn',
      body: `<p>Le fichier de création a été téléchargé, mais ${crea.length > 1 ? 'les produits créés n\'ont' : 'le produit créé n\'a'} pas encore de Clé Toporder dans l'appli (${crea.map(c => esc(fullName(c))).join(', ')}).</p>
        <p>Après les avoir importés dans Toporder, téléchargez la matrice (<b>Stock → Import de stock</b>) et importez-la ici : ${crea.length > 1 ? 'leurs lignes entreront' : 'sa ligne entrera'} alors dans le fichier de stock.</p>`,
      ok: 'Importer la nouvelle matrice', cancel: 'Annuler'
    });
    if (go === true) $('matrixInput').click();
    return false;
  }
  // Mêmes conditions que le bouton « Générer » (utile quand on passe par « Nouvel import »).
  const why = !lignes.length ? "Aucune ligne n'est prête à importer : traitez les lignes à vérifier."
    : (inv.doublon && !inv.force) ? 'Ce document a déjà été traité : cochez « Traiter quand même » pour le réimporter.'
    : !inv.head.date ? 'Saisissez la date du document dans l\'en-tête.' : '';
  if (why) { await showError('Impossible de générer le fichier', why); return false; }
  const todoLines = inv.lines.filter(l => l.kind === 'produit' && !l.included), todo = todoLines.length;
  if (todo) {
    const s = (n) => n > 1 ? 's' : '';
    const lieux = [...new Set(lignes.map(l => l.lieu))].map(lieuLabel).join(', ');
    const ok = await dialog({
      tone: 'warn', title: `Générer le fichier avec ${lignes.length} ligne${s(lignes.length)} ?`,
      body: `<p><b>${todo} ligne${s(todo)} à vérifier ne ser${todo > 1 ? 'ont' : 'a'} pas dans le fichier :</b></p>
        <ul>${todoLines.slice(0, 6).map(l => `<li>${esc(l.src.libelle)} <span class="muted small">— ${esc(l.alerts.filter(a => ALERTS[a.code].block).map(a => ALERTS[a.code].label).join(', '))}</span></li>`).join('')}
          ${todo > 6 ? `<li class="muted">et ${todo - 6} autre${s(todo - 6)}</li>` : ''}</ul>
        <p class="muted small">Pour les ajouter plus tard : redéposez ${inv.head.type === 'BL' ? 'le BL' : 'la facture'} et cochez « Traiter quand même ».</p>
        <p class="small">Boutique : <b>${esc(lieux)}</b></p>`,
      ok: 'Générer le fichier', cancel: 'Revenir aux lignes'
    });
    if (!ok) return false;
  }
  const btn = $('genBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Génération…'; }
  try {
    inv.result = await call('genererFichier', {
      emetteur: inv.head.emetteur, numero: inv.head.numero, dateFacture: isoToFr(inv.head.date), typeDocument: inv.head.type,
      lieuDefaut: inv.lieu, force: inv.force, nbAlertes: todo, lignes,
      totalHt: num(inv.res.extraction.total_ht), historique: historyLines(inv)
    });
    inv.status = 'genere';
    loadDashboard();
    recheckDoublons(inv);
    inv.result.files.forEach(f => download(f));
    render();
    return true;
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Générer le fichier d'import"; }
    // Déjà enregistré entre la lecture et la génération (« Nouvel import → Enregistrer », autre poste, même document déposé deux fois) :
    // l'écran n'affichait pas l'alerte. On la rafraîchit et on propose directement de traiter quand même.
    if (/^DOUBLON:/.test(err.message)) {
      try { const r = await call('verifierDoublon', inv.head.emetteur, inv.head.numero, inv.lieu); inv.doublon = r.doublon; inv.bls = r.bls || {}; } catch (e) {}
      refresh();
      const d = inv.doublon;
      const choice = await dialog({
        tone: 'warn', title: 'Document déjà enregistré',
        body: `<p>${esc(err.message.replace(/^DOUBLON:\s*/, '').replace(/ Cochez.*$/, ''))}</p>
          <p>Le réimporter ajouterait la marchandise <b>une deuxième fois</b> au stock. Vérifiez dans l'historique que c'est bien le même document.</p>`,
        ok: 'Traiter quand même', alt: d && d.id ? "Voir dans l'historique" : '', cancel: 'Annuler'
      });
      if (choice === true) { inv.force = true; refresh(); return generate(); }
      if (choice === 'alt') showHistoryById(d.id);
      return false;
    }
    await showError('Génération impossible', err);
    return false;
  }
}
// Après un enregistrement : les autres documents de la file peuvent être devenus des doublons (même BL déposé deux fois).
function recheckDoublons(except) {
  S.queue.forEach(q => {
    if (q === except || q.status !== 'pret') return;
    call('verifierDoublon', q.head.emetteur, q.head.numero, q.lieu).then(r => {
      q.doublon = r.doublon; q.bls = r.bls || {}; if (!r.doublon) q.force = false;
      if (q === cur()) refresh(); else evaluate(q);
    }).catch(() => {});
  });
}
async function showHistoryById(id) {
  if (!S.hist) await loadDashboard();
  const e = (S.hist || []).find(x => x.id === id);
  if (e) openHistoryEntry(e); else { setView('historique'); }
}

// ── Nouvel import ──────────────────────────────────────────────────
// Ferme le document affiché pour en déposer un autre. S'il n'est pas encore enregistré (fichier non généré),
// propose de l'enregistrer (générer le fichier d'import + historique) ou de l'abandonner.
async function newImport() {
  const inv = cur();
  if (inv && inv.status === 'pret') {
    const doc = inv.head.type === 'BL' ? 'le BL' : 'la facture';
    const ready = inv.lines.filter(l => l.included).length;
    const choice = await dialog({
      tone: 'warn', title: `Enregistrer ${doc} ${inv.head.emetteur || ''} ${inv.head.numero || ''} avant de passer à un autre import ?`.replace(/\s+/g, ' '),
      body: `<p><b>Enregistrer</b> génère le fichier d'import Toporder (${ready} ligne${ready > 1 ? 's' : ''} prête${ready > 1 ? 's' : ''}) et l'ajoute à l'historique et au tableau de bord.</p>
        <p><b>Ne pas enregistrer</b> abandonne ${doc} : rien n'est gardé, il faudra la redéposer pour la traiter.</p>`,
      ok: 'Enregistrer', alt: 'Ne pas enregistrer', cancel: 'Annuler'
    });
    if (choice === false) return;
    if (choice === true && !(await generate())) return;
  }
  // On retire le document de la file (statut « clos ») plutôt que de le supprimer : la lecture en cours n'est pas perturbée.
  if (inv && inv.status !== 'lecture' && inv.status !== 'attente') inv.status = 'clos';
  const next = S.queue.findIndex(q => q.status === 'pret' || q.status === 'lecture' || q.status === 'attente');
  S.current = next;
  S.view = 'factures';
  closeModal(); render(); window.scrollTo(0, 0);
  if (next < 0) toast('Prêt pour un nouvel import : déposez une facture ou un BL');
}
// Détail enregistré dans l'historique : chaque ligne de la facture, importée ou non (valeurs seulement).
function historyLines(inv) {
  const out = [];
  const motifs = (L, block) => L.alerts.filter(a => ALERTS[a.code].block === block).map(a => ALERTS[a.code].label + ' : ' + a.msg).join(' | ');
  inv.lines.forEach(L => {
    const s = L.src;
    const base = {
      type: L.kind, libelle: s.libelle, ref: s.ref_fournisseur || '', ean: s.ean || '', qteFacture: num(s.quantite), uniteFacture: s.unite,
      puFacture: num(s.prix_unitaire_ht_net), montantFacture: num(s.montant_ht), dlcFacture: isoToFr(s.dlc),
      cle: L.match ? L.match.k : '', produit: L.match ? L.match.n : '',
      bl: inv.head.type === 'BL' ? inv.head.numero : (s.bl_origine || '')
    };
    if (L.included) {
      L.alloc.filter(a => Number(a.q) > 0).forEach(a => out.push(Object.assign({}, base, {
        statut: 'importée', motif: motifs(L, false), lieu: a.lieu, qte: Number(a.q), unite: L.match.u,
        pu: L.pu, valeur: round(Number(a.q) * (L.pu || 0), 2), dlc: isoToFr(L.dlc)
      })));
    } else {
      out.push(Object.assign({}, base, { statut: 'non importée', motif: L.kind === 'frais' || L.kind === 'autre' || L.kind === 'non_livre' ? kindMotif(L) : motifs(L, true) }));
    }
  });
  return out;
}

async function deleteHistory() {
  const e = S.histOpen.e, doc = e.type === 'BL' ? 'le BL' : 'la facture';
  const ok = await dialog({
    tone: 'danger', title: `Supprimer ${doc} ${e.emetteur} n° ${e.numero} de l'historique ?`,
    body: `<p>${esc(lieuLabel(e.lieu))} · traité${e.type === 'BL' ? '' : 'e'} le ${esc(e.traite)}</p>
      <p><b>Rien ne change dans Toporder</b> : si le fichier a déjà été importé, le stock reste tel quel.</p>
      <p class="muted small">${doc.charAt(0).toUpperCase() + doc.slice(1)} pourra de nouveau être traité${e.type === 'BL' ? '' : 'e'} sans l'alerte « déjà traitée », et disparaîtra du tableau de bord.</p>`,
    ok: 'Supprimer', cancel: 'Annuler'
  });
  if (!ok) return;
  // Retirée de l'écran tout de suite ; le Sheet est mis à jour en arrière-plan (remise en place si ça échoue).
  const hist = S.hist, dash = S.dash;
  S.hist = hist.filter(x => x !== e);
  if (dash) S.dash = Object.assign({}, dash, { imports: dash.imports.filter(x => x !== e) });
  if (S.details) delete S.details[e.id];
  S.histOpen = null; render(); toast('Suppression en cours…');
  try {
    await call('supprimerHistorique', e.id, e.row, e.emetteur, e.numero);
    toast('Entrée supprimée');
    loadDashboard();
    S.queue.forEach(q => { if (q.status === 'pret') { call('verifierDoublon', q.head.emetteur, q.head.numero, q.lieu).then(r => { q.doublon = r.doublon; q.bls = r.bls || {}; if (!r.doublon) q.force = false; evaluate(q); }).catch(() => {}); } });
  } catch (err) {
    S.hist = hist; S.dash = dash; render();
    showError('Suppression impossible', err);
  }
}

  const { e, detail } = S.histOpen;
  let h = `<div class="panel"><div class="panel-head"><button class="btn btn-sm" onclick="S.histOpen=null;render()">‹ Retour</button>

  const imp = detail.lignes.filter(l => l.statut === 'importée'), non = detail.lignes.filter(l => l.statut !== 'importée');
  if (!detail.lignes.length) h += `<div class="banner info"><div class="grow">Détail des lignes non disponible (facture traitée avant l'ajout de l'historique détaillé).</div></div>`;
  h += `<div class="stats"><div class="stat ok"><b>${imp.length}</b> lignes importées</div><div class="stat warn"><b>${non.filter(l => !/^Frais/.test(l.motif)).length}</b> non importées</div>
    <div class="stat"><b>${fmtN(e.valeur || 0, 2)} €</b> HT importés</div></div>`;
  if (imp.length) {
    h += `<div class="group-title">Importées dans Toporder</div><div class="table-wrap"><table><thead><tr><th>Ligne facture</th><th>Produit Toporder</th><th>Boutique</th><th>Qté</th><th>PU HT</th><th>Valeur</th><th>DLC</th><th>Remarque</th></tr></thead><tbody>
      ${imp.map(l => `<tr><td><div class="lib">${esc(l.libelle)}</div><div class="sub">${[l.ref ? 'Réf. ' + l.ref : '', l.ean ? 'EAN ' + l.ean : ''].filter(Boolean).map(esc).join(' · ')}</div></td>
        <td>${esc(l.produit)}<div class="sub">Clé ${esc(l.cle)}</div></td><td>${esc(l.lieu)}</td><td>${fmtN(l.qte, 3)} <span class="sub">${esc(l.unite)}</span></td>
        <td>${fmtE(num(l.pu))}</td><td>${fmtE(num(l.valeur))}</td><td>${esc(l.dlc) || '—'}</td><td class="small" style="color:var(--warn)">${esc(l.motif)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if (non.length) {
    h += `<div class="group-title">Non importées</div><div class="table-wrap"><table><thead><tr><th>Ligne facture</th><th>Qté facture</th><th>Montant HT</th><th>Motif</th></tr></thead><tbody>
      ${non.map(l => `<tr><td><div class="lib">${esc(l.libelle)}</div><div class="sub">${[l.type, l.ref ? 'Réf. ' + l.ref : '', l.ean ? 'EAN ' + l.ean : ''].filter(Boolean).map(esc).join(' · ')}</div></td>
        <td>${l.qteFacture !== '' ? fmtN(num(l.qteFacture), 3) + ' ' + esc(unitLabel(l.uniteFacture)) : '—'}</td><td>${fmtE(num(l.montantFacture))}</td><td class="small">${esc(l.motif)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if (detail.crees.length) {
    h += `<div class="group-title">Produits créés depuis cette facture</div><div class="table-wrap"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>EAN</th><th>Achat HT</th><th>Vente TTC</th><th>Fournisseur</th><th>Fichier généré le</th></tr></thead><tbody>
      ${detail.crees.map(c => `<tr><td class="lib">${esc(c.nom)}<div class="sub">${esc(c.unite)} · TVA ${esc(c.tva)} %</div></td><td>${esc(c.cat)}</td><td>${esc(c.ean) || '—'}</td>
        <td>${fmtE(num(c.pa))}</td><td>${fmtE(num(c.pv))}</td><td>${esc(c.fournisseur)}</td><td class="small">${esc(c.date)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return h + `</div>`;
}

// ── Tableau de bord : entrées en stock par boutique ────────────────
// Une couleur par boutique, dans l'ordre fixe des lieux (jamais selon le classement).
const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100'];
const DAY = 86400000;
const pad2 = (n) => String(n).padStart(2, '0');
const unitShort = (u) => /kilo/i.test(u) ? 'kg' : 'art.';

// Historique + tableau de bord en un seul appel. Spinner seulement au tout premier chargement : ensuite les données
// déjà en mémoire restent affichées pendant la mise à jour, et l'écran n'est redessiné que s'il les montre
// (jamais pendant la vérification d'une facture, pour ne pas perdre une saisie en cours).
function loadDashboard() {
  if (S.dashReq) return S.dashReq;
  S.dashLoading = !S.dash; S.dashError = null;
  const onView = () => S.view === 'historique' || S.view === 'dashboard';
  S.dashReq = call('getDashboard').then(d => {
    const byImp = {};
    d.lignes.forEach(l => (byImp[l[0]] = byImp[l[0]] || []).push({ lieu: l[1], cle: l[2], produit: l[3], qte: l[4], unite: l[5], valeur: l[6] }));
    d.byImp = byImp; S.dash = d; S.hist = d.imports;
    prefetchDetails();
  }).catch(err => { if (!S.dash) S.dashError = err.message; })
    .then(() => { S.dashLoading = false; S.dashReq = null; const f = document.activeElement; if (onView() && !(f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName))) render(); });
  return S.dashReq;
}
// Détail des 40 derniers documents chargé d'avance (un seul appel) : « Détail » s'ouvre sans attente.
function prefetchDetails() {
  const known = S.details || {};
  const todo = S.hist.filter(e => e.id && !known[e.id]).slice(0, 40).map(e => ({ id: e.id, emetteur: e.emetteur, numero: e.numero }));
  if (!todo.length) return;
  call('getHistoriqueDetails', todo).then(map => {
    S.details = Object.assign(S.details || {}, map);
    if (S.histOpen && !S.histOpen.detail && map[S.histOpen.e.id]) { S.histOpen.detail = map[S.histOpen.e.id]; render(); }
  }).catch(() => {});
}
function setDashF(k, v) { S.dashF[k] = v; render(); }

// Lieux dans un ordre fixe : ceux du catalogue, puis les anciens noms présents dans l'historique.
function dashLieux() {
  const out = S.init.lieux.slice();
  S.dash.imports.forEach(e => { (S.dash.byImp[e.id] || [{ lieu: e.lieu }]).forEach(l => { if (l.lieu && out.indexOf(l.lieu) < 0) out.push(l.lieu); }); });
  return out;
}
const lieuColor = (lieu) => SERIES[Math.max(0, dashLieux().indexOf(lieu)) % SERIES.length];

// Mouvements (entrées) retenus par les filtres. Une facture traitée avant l'historique détaillé
// compte pour sa valeur totale dans sa boutique par défaut.
function dashData() {
  const F = S.dashF;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tsList = S.dash.imports.map(e => e.ts).filter(Boolean);
  const since = F.per === 'tout' ? (tsList.length ? Math.min(...tsList) : today.getTime()) : today.getTime() - (Number(F.per) - 1) * DAY;
  const imports = S.dash.imports.filter(e => (F.per === 'tout' || e.ts >= since) && (!F.fourn || e.emetteur === F.fourn) && (!F.type || e.type === F.type));
  const mv = [];
  imports.forEach(e => {
    const lines = S.dash.byImp[e.id];
    if (lines) lines.forEach(l => mv.push(Object.assign({ e }, l)));
    else if (e.valeur) mv.push({ e, lieu: e.lieu, cle: '', produit: '', qte: 0, unite: '', valeur: e.valeur, legacy: true });
  });
  // Un ancien nom de lieu (avant renommage dans Toporder) n'apparaît que s'il a des entrées sur la période.
  const lieux = dashLieux().filter(l => (!F.lieu || l === F.lieu) && (S.init.lieux.indexOf(l) >= 0 || mv.some(m => m.lieu === l)));
  return { since, imports, mv: mv.filter(m => lieux.indexOf(m.lieu) >= 0), lieux };
}

// Découpage du graphique : jour (≤ 31 j), semaine (≤ 6 mois), sinon mois.
function dashBuckets(since) {
  const span = (Date.now() - since) / DAY;
  const g = span <= 31 ? 'jour' : span <= 190 ? 'semaine' : 'mois';
  const key = (ts) => {
    const d = new Date(ts); d.setHours(0, 0, 0, 0);
    if (g === 'semaine') d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    if (g === 'mois') return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };
  const label = (k) => {
    const [y, m, d] = k.split('-');
    if (g === 'mois') return new Date(+y, +m - 1, 1).toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' });
    return (g === 'semaine' ? 'sem. du ' : '') + d + '/' + m;
  };
  const keys = [];
  for (let t = since; t <= Date.now(); t += DAY) { const k = key(t); if (keys[keys.length - 1] !== k) keys.push(k); }
  return { g, key, label, keys };
}

function renderDashboard() {
  if (S.dashLoading || (!S.dash && !S.dashError)) return `<div class="panel loading"><span class="spinner"></span> Chargement du tableau de bord…</div>`;
  if (S.dashError) return `<div class="banner error"><div class="grow">${esc(S.dashError)}</div><button class="btn btn-sm" onclick="loadDashboard();render()">Réessayer</button></div>`;
  const F = S.dashF || (S.dashF = { per: '30', lieu: '', fourn: '', type: '' });
  const D = dashData();
  S.dashView = D;
  const fourns = [...new Set(S.dash.imports.map(e => e.emetteur))].sort();
  const allLieux = dashLieux();

  let h = `<div class="panel"><div class="panel-head">Entrées en stock par boutique<span class="spacer"></span>
    ${S.dashReq ? '<span class="small muted" style="margin-right:8px"><span class="spinner"></span> mise à jour…</span>' : ''}<button class="btn btn-sm" onclick="loadDashboard();render()">Actualiser</button></div>
    <div class="dash-filters">
      <div class="field"><label class="label">Période</label><div class="seg">${[['7', '7 j'], ['30', '30 j'], ['90', '3 mois'], ['365', '12 mois'], ['tout', 'Tout']]
        .map(([v, l]) => `<button class="${F.per === v ? 'on' : ''}" onclick="setDashF('per','${v}')">${l}</button>`).join('')}</div></div>
      <div class="field"><label class="label">Boutique</label><select id="dfLieu" onchange="setDashF('lieu', this.value)"><option value="">Toutes</option>
        ${allLieux.map(l => `<option ${l === F.lieu ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Fournisseur</label><select id="dfFourn" onchange="setDashF('fourn', this.value)"><option value="">Tous</option>
        ${fourns.map(f => `<option ${f === F.fourn ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Document</label><select id="dfType" onchange="setDashF('type', this.value)">
        ${[['', 'Factures et BL'], ['Facture', 'Factures'], ['BL', 'Bons de livraison']].map(([v, l]) => `<option value="${v}" ${v === F.type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>`;

  if (!S.dash.imports.length) return h + `<p class="muted">Aucune facture ni BL importé pour l'instant : le tableau de bord se remplira à chaque fichier d'import généré.</p></div>`;

  // Indicateurs par boutique
  const kpi = (lieu) => {
    const m = D.mv.filter(x => !lieu || x.lieu === lieu);
    const recs = new Set(m.map(x => x.e.id || x.e.row)).size;
    const art = m.filter(x => x.unite && !/kilo/i.test(x.unite)).reduce((s, x) => s + x.qte, 0);
    const kg = m.filter(x => /kilo/i.test(x.unite)).reduce((s, x) => s + x.qte, 0);
    const lignes = m.filter(x => !x.legacy).length;
    return { val: m.reduce((s, x) => s + x.valeur, 0), recs, art, kg, lignes };
  };
  const card = (name, color, k) => `<div class="kpi"><div class="k-name">${color ? `<span class="sw" style="background:${color}"></span>` : ''}${esc(name)}</div>
    <div class="k-val">${fmtN(k.val, 0)} € <span class="small muted" style="font-family:var(--font-b);font-weight:500;letter-spacing:0">HT</span></div>
    <div class="k-sub">${k.recs} réception${k.recs > 1 ? 's' : ''} · ${k.lignes} ligne${k.lignes > 1 ? 's' : ''} produit</div>
    <div class="k-sub">+${fmtN(k.art, 0)} article${k.art >= 2 ? 's' : ''}${k.kg ? ` · +${fmtN(k.kg, 1)} kg` : ''}</div></div>`;
  h += `<div class="kpis">${D.lieux.map(l => card(l, lieuColor(l), kpi(l))).join('')}${D.lieux.length > 1 ? card('Total', '', kpi('')) : ''}</div>`;

  // Graphique : valeur HT entrée par période et par boutique
  const B = dashBuckets(D.since);
  h += `<div class="group-title" style="margin-top:4px">Valeur HT entrée en stock, par ${B.g}</div>
    ${D.lieux.length > 1 ? `<div class="legend">${D.lieux.map(l => `<span><span class="sw" style="background:${lieuColor(l)}"></span>${esc(l)}</span>`).join('')}</div>` : ''}
    <div class="chart" id="dashChart"></div>
    <details><summary class="small" style="font-family:var(--font-b);font-size:12.5px;font-weight:600;margin:8px 0">Voir les données du graphique</summary>
    <div class="table-wrap"><table style="min-width:0"><thead><tr><th>${B.g}</th>${D.lieux.map(l => `<th class="n">${esc(l)}</th>`).join('')}</tr></thead><tbody>
    ${B.keys.map(k => { const vals = D.lieux.map(l => D.mv.filter(x => x.lieu === l && B.key(x.e.ts) === k).reduce((s, x) => s + x.valeur, 0));
      return vals.some(Boolean) ? `<tr><td>${esc(B.label(k))}</td>${vals.map(v => `<td class="n">${v ? fmtE(v) : '—'}</td>`).join('')}</tr>` : ''; }).join('')}
    </tbody></table></div></details>`;

  // Journal : chaque import, avec l'incrément de chaque boutique
  const rowsJ = D.imports.map(e => {
    const m = D.mv.filter(x => x.e === e);
    return { e, per: D.lieux.map(l => { const y = m.filter(x => x.lieu === l); return { n: y.filter(x => !x.legacy).length, v: y.reduce((s, x) => s + x.valeur, 0), any: y.length > 0 }; }) };
  }).filter(r => r.per.some(p => p.any));
  const shown = S.dashAll ? rowsJ : rowsJ.slice(0, 25);
  h += `<div class="group-title">Journal des entrées <span class="muted small" style="font-family:var(--font-b);font-weight:500">${rowsJ.length} document${rowsJ.length > 1 ? 's' : ''} · cliquer pour le détail</span></div>`;
  h += rowsJ.length ? `<div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Importé le</th><th>Fournisseur</th><th>Document</th>
      ${D.lieux.map(l => `<th class="n"><span class="sw" style="background:${lieuColor(l)};margin-right:6px"></span>${esc(l)}</th>`).join('')}</tr></thead><tbody>
    ${shown.map(r => `<tr class="click" onclick="openHistoryEntry(S.dash.imports[${S.dash.imports.indexOf(r.e)}])"><td>${esc(r.e.traite)}</td><td class="lib">${esc(r.e.emetteur)}</td>
      <td><span class="badge grey">${r.e.type === 'BL' ? 'BL' : 'Facture'}</span>${esc(r.e.numero)}${r.e.dateFacture ? `<div class="sub">du ${esc(r.e.dateFacture)}</div>` : ''}</td>
      ${r.per.map(p => `<td class="n">${p.any ? `<b>+${fmtE(p.v)}</b><div class="sub">${p.n ? `${p.n} ligne${p.n > 1 ? 's' : ''}` : 'détail non disponible'}</div>` : '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>${rowsJ.length > shown.length ? `<button class="btn-link" style="margin-top:8px" onclick="S.dashAll=true;render()">Afficher les ${rowsJ.length} documents</button>` : ''}`
    : `<p class="muted">Aucune entrée sur cette période.</p>`;

  // Produits : quantités ajoutées par boutique, avec le stock actuel lu dans la dernière matrice
  const prods = {};
  D.mv.filter(x => !x.legacy).forEach(x => {
    const k = x.cle || x.produit;
    const p = prods[k] || (prods[k] = { cle: x.cle, produit: x.produit, unite: x.unite, valeur: 0, recs: new Set(), q: {} });
    p.valeur += x.valeur; p.recs.add(x.e.id); p.q[x.lieu] = (p.q[x.lieu] || 0) + x.qte;
  });
  const q = normLabel(S.dashQ || '');
  const plist = Object.values(prods).filter(p => !q || normLabel(p.produit).indexOf(q) >= 0).sort((a, b) => b.valeur - a.valeur);
  const ci = S.dash.catalogueInfo;
  h += `<div class="group-title">Produits réapprovisionnés <span class="spacer" style="flex:1"></span>
    <input type="search" id="dashQ" placeholder="Rechercher un produit…" value="${esc(S.dashQ || '')}" oninput="S.dashQ=this.value;clearTimeout(S.dashT);S.dashT=setTimeout(render,250)" style="min-width:220px;font-weight:400"></div>`;
  h += plist.length ? `<div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Produit</th>
      ${D.lieux.map(l => `<th class="n"><span class="sw" style="background:${lieuColor(l)};margin-right:6px"></span>${esc(l)}</th>`).join('')}<th class="n">Valeur HT</th><th class="n">Réceptions</th></tr></thead><tbody>
    ${plist.slice(0, 30).map(p => `<tr><td class="lib">${esc(p.produit)}${p.cle ? `<div class="sub">Clé ${esc(p.cle)}</div>` : ''}</td>
      ${D.lieux.map(l => { const st = ((S.init.stock || {})[l] || {})[p.cle];
        return `<td class="n">${p.q[l] ? `<b>+${fmtN(p.q[l], 3)}</b> ${unitShort(p.unite)}` : '<span class="muted">—</span>'}${st != null ? `<div class="sub">stock : ${fmtN(st, 3)}</div>` : ''}</td>`; }).join('')}
      <td class="n">${fmtE(p.valeur)}</td><td class="n">${p.recs.size}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:6px">${plist.length > 30 ? `30 premiers sur ${plist.length} (par valeur). ` : ''}« stock » = quantité restante dans la matrice Toporder${ci ? ` mise à jour le ${esc(ci.date)}` : ''} (les imports postérieurs n'y sont pas encore).</p>`
    : `<p class="muted">${q ? 'Aucun produit ne correspond.' : 'Aucun produit sur cette période.'}</p>`;
  return h + `</div>`;
}

// Barres groupées dessinées à la largeur réelle du conteneur (texte lisible sur mobile comme sur ordinateur).
function drawDashChart() {
  const el = $('dashChart'); if (!el || !S.dashView) return;
  const D = S.dashView, B = dashBuckets(D.since);
  const data = B.keys.map(k => D.lieux.map(l => D.mv.filter(x => x.lieu === l && B.key(x.e.ts) === k).reduce((s, x) => s + x.valeur, 0)));
  const W = el.clientWidth || 800, H = 240, m = { l: 56, r: 8, t: 10, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(0, ...data.flat());
  const step = (() => { const raw = (max || 100) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw); })();
  const top = step * 4, y = (v) => m.t + ph - v / top * ph;
  const n = B.keys.length, gw = pw / n, k = D.lieux.length;
  const bw = Math.max(2, Math.min(26, (gw * 0.72 - (k - 1) * 2) / k));
  const every = Math.ceil(n / Math.max(1, Math.floor(pw / 64)));
  const bar = (x, v, w) => { const yy = y(v), h = m.t + ph - yy; if (h <= 0) return ''; const r = Math.min(4, w / 2, h);
    return `M${x},${yy + h}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${yy + h}Z`; };
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="Valeur HT entrée en stock par ${B.g} et par boutique">`;
  for (let i = 0; i <= 4; i++) {
    const v = step * i, yy = y(v);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="${i ? '#EFEBE4' : '#CFC8BB'}" stroke-width="1"/>
      <text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${fmtN(v, 0)} €</text>`;
  }
  data.forEach((vals, i) => {
    const x0 = m.l + i * gw + (gw - (k * bw + (k - 1) * 2)) / 2;
    svg += `<rect class="hb" data-i="${i}" x="${m.l + i * gw}" y="${m.t}" width="${gw}" height="${ph}" fill="transparent"/>`;
    vals.forEach((v, j) => { if (v > 0) svg += `<path d="${bar(x0 + j * (bw + 2), v, bw)}" fill="${lieuColor(D.lieux[j])}" pointer-events="none"/>`; });
    if (i % every === 0) svg += `<text x="${m.l + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(B.label(B.keys[i]).replace('sem. du ', ''))}</text>`;
  });
  svg += `</svg><div class="tip hidden" id="dashTip"></div>`;
  el.innerHTML = svg;
  const tip = $('dashTip');
  const show = (ev) => {
    const r = ev.target.closest && ev.target.closest('.hb'); if (!r) return;
    el.querySelectorAll('.hb').forEach(b => b.setAttribute('fill', 'transparent'));
    r.setAttribute('fill', 'rgba(26,26,26,.04)');
    const i = Number(r.dataset.i), key = B.keys[i];
    const recs = new Set(D.mv.filter(x => B.key(x.e.ts) === key).map(x => x.e.id || x.e.row)).size;
    tip.innerHTML = `<div class="t-h">${esc(B.label(key))}</div>${D.lieux.map((l, j) => `<div class="t-r"><span><span class="sw" style="background:${lieuColor(l)}"></span>${esc(l)}</span><b>${fmtE(data[i][j])}</b></div>`).join('')}
      <div class="sub" style="margin-top:4px">${recs} réception${recs > 1 ? 's' : ''}</div>`;
    tip.classList.remove('hidden');
    const cx = m.l + i * gw + gw / 2, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, cx + 12 + tw > W ? cx - tw - 12 : cx + 12)) + 'px';
    tip.style.top = '8px';
  };
  const svgEl = el.querySelector('svg');
  svgEl.addEventListener('mousemove', show);
  svgEl.addEventListener('click', show);
  svgEl.addEventListener('mouseleave', () => { tip.classList.add('hidden'); el.querySelectorAll('.hb').forEach(b => b.setAttribute('fill', 'transparent')); });
}
window.addEventListener('resize', () => { clearTimeout(S.rsT); S.rsT = setTimeout(() => { if (S.view === 'dashboard') drawDashChart(); }, 150); });

// Fichier d'import d'un document de l'historique, refait à l'identique depuis les lignes enregistrées.
async function redownload(id, btn) {
  const e = (S.hist || []).find(x => x.id === id);
  const doc = e ? `${e.type === 'BL' ? 'du BL' : 'de la facture'} ${e.emetteur} n° ${e.numero}` : '';
  const ok = await dialog({
    tone: 'warn', title: 'Ce fichier semble déjà avoir été importé',
    body: `<p>Le fichier d'import ${esc(doc)} a été généré le ${esc(e ? e.traite : '')}${e && e.auteur ? ' par ' + esc(e.auteur) : ''}.</p>
      <p><b>Vérifiez dans Toporder qu'il n'a pas déjà été importé.</b> S'il l'a été, ne le réimportez pas : le stock serait compté en double.</p>`,
    ok: 'Télécharger quand même', cancel: 'Annuler'
  });
  if (ok !== true) return;
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try {
    const files = await call('retelechargerImport', id);
    files.forEach(f => download(f));
    toast(files.length > 1 ? files.length + ' fichiers téléchargés' : 'Fichier téléchargé');
  } catch (err) { showError('Téléchargement impossible', err); }
  if (btn) { btn.disabled = false; btn.textContent = label; }
}
function download(f) {
  const bytes = Uint8Array.from(atob(f.base64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function downloadFile(i, j) { download(S.queue[i].result.files[j]); }
// Ouvre la facture déposée depuis le navigateur (elle n'est pas conservée sur Drive).
function viewInvoice() {
  const url = URL.createObjectURL(cur().file);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ── Glisser-déposer ────────────────────────────────────────────────
$('fileInput').addEventListener('change', ev => { addFiles(ev.target.files); ev.target.value = ''; });
function bindDrop() {
  const d = $('drop'); if (!d) return;
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); });
}
window.addEventListener('beforeunload', e => { if (S.queue.some(q => q.status === 'pret' || q.status === 'lecture')) { e.preventDefault(); e.returnValue = ''; } });

load();
</script>
